<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korpa - Catalogo</title>
<meta name="description" content="Confira as pecas fitness disponiveis na Korpa.">
<meta property="og:title" content="Korpa - Catalogo">
<meta property="og:description" content="Confira as pecas fitness disponiveis na Korpa.">
<meta property="og:type" content="website">
<style>
:root{--bg:#f8f1e7;--card:#fffdfa;--ink:#3a2e2b;--muted:#756258;--accent:#b76e79;--accent-dark:#8f4f56;--danger:#c0392b;--border:#ecdfd0;}
*{box-sizing:border-box;}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:0 0 8px;}
a{color:inherit;text-decoration:none;}
.topbar{background:var(--accent-dark);color:#fff;padding:16px 24px;position:sticky;top:0;z-index:10;}
.topbar-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.topbar h1{font-size:22px;margin:0;cursor:pointer;}
.searchbox{flex:1;max-width:360px;}
.searchbox input{width:100%;padding:9px 12px;border-radius:20px;border:none;font-size:14px;}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;padding:48px 24px;text-align:center;}
.hero h2{font-size:30px;color:#fff;}
.hero p{font-size:15px;opacity:0.9;margin-top:4px;}
.wrap{max-width:1200px;margin:0 auto;padding:24px;}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 14px;}
.section-title h3{font-size:20px;}
.section-title a{font-size:13px;color:var(--accent-dark);}
.chipsrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.chip{background:var(--card);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;}
.chip.active{background:var(--accent-dark);color:#fff;border-color:var(--accent-dark);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s;}
.pcard:hover{transform:translateY(-3px);}
.pcard .imgwrap{aspect-ratio:1/1;background:#f1e9dc;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.pcard img{width:100%;height:100%;object-fit:cover;}
.pcard .noimg{color:var(--muted);font-size:12px;}
.pcard .badge-oos{position:absolute;top:8px;left:8px;background:var(--danger);color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;}
.pcard .badge-promo{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;}
.pcard .info{padding:10px 12px;}
.pcard .pname{font-size:14px;font-weight:bold;margin-bottom:4px;min-height:34px;}
.pcard .pcat{font-size:11px;color:var(--muted);}
.pcard .pprice{margin-top:6px;font-size:15px;font-weight:bold;color:var(--accent-dark);}
.pcard .pprice .old{font-size:12px;color:var(--muted);text-decoration:line-through;font-weight:normal;margin-right:6px;}
.filtersbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filtersbar select,.filtersbar input{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;}
.muted{color:var(--muted);}
.empty{text-align:center;padding:40px;color:var(--muted);}
.footer{text-align:center;padding:30px;color:var(--muted);font-size:13px;}
/* product detail */
.detail{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
.gallery-main{aspect-ratio:1/1;background:#f1e9dc;border-radius:10px;overflow:hidden;margin-bottom:10px;}
.gallery-main img{width:100%;height:100%;object-fit:cover;}
.gallery-thumbs{display:flex;gap:8px;flex-wrap:wrap;}
.gallery-thumbs img{width:60px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;}
.gallery-thumbs img.active{border-color:var(--accent-dark);}
.detail h2{font-size:26px;}
.detail .price{font-size:26px;font-weight:bold;color:var(--accent-dark);margin:10px 0;}
.detail .price .old{font-size:15px;color:var(--muted);text-decoration:line-through;font-weight:normal;margin-right:8px;}
.sizerow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
.sizechip{border:1px solid var(--border);padding:6px 12px;border-radius:6px;font-size:13px;}
.sizechip.unavailable{color:var(--muted);text-decoration:line-through;background:#f4efe8;}
.actionbtn{background:var(--accent-dark);color:#fff;border:none;padding:12px 20px;border-radius:6px;cursor:pointer;font-size:15px;margin-top:14px;margin-right:8px;}
.actionbtn.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent-dark);}
.backlink{display:inline-block;margin-bottom:16px;color:var(--accent-dark);cursor:pointer;font-size:14px;}
@media(max-width:720px){
  .detail{grid-template-columns:1fr;}
  .hero h2{font-size:22px;}
  .wrap{padding:14px;}
}
</style>
</head>
<body>
<div id="app"><div class="wrap">Carregando catalogo...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL = "https://sksqtrlqbcaazsreqdps.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrc3F0cmxxYmNhYXpzcmVxZHBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzOTA3NTksImV4cCI6MjA5OTk2Njc1OX0.GHfc89i3Lw5te62l6errMN3Ms_W5Bsu8jguATBe2D38";
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var STORE_NAME = "Korpa";
var WHATSAPP_NUMBER = ""; // ex: "5585999999999" - opcional, deixa vazio pra ocultar o botao de interesse via WhatsApp

var products = [];
var loaded = false;
var galleryIndex = 0;

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function brl(n){ return "R$ " + Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }

async function loadProducts(){
  var res = await sb.from("catalog_products").select("*").order("created_at", {ascending:false});
  if(res.error){
    document.getElementById("app").innerHTML = "<div class=\"wrap\"><p>Nao foi possivel carregar o catalogo agora. Tente novamente em instantes.</p></div>";
    console.error(res.error);
    return;
  }
  products = res.data || [];
  loaded = true;
  route();
}

/* ---------- ROUTING (hash based, static hosting friendly) ---------- */

function route(){
  var hash = window.location.hash || "#home";
  if(hash.indexOf("#produto/") === 0){
    renderProductPage(hash.replace("#produto/",""));
  } else if(hash.indexOf("#categoria/") === 0){
    renderHome(decodeURIComponent(hash.replace("#categoria/","")));
  } else {
    renderHome(null);
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ---------- HELPERS ---------- */

function visibleProducts(list){
  return list.filter(function(p){ return p.in_stock || !p.hide_when_out_of_stock; });
}
function productCardHtml(p){
  var img = (p.images && p.images.length) ? p.images[0] : null;
  var priceHtml = p.promo_price ? ("<span class=\"old\">"+brl(p.price)+"</span>"+brl(p.promo_price)) : brl(p.price);
  return "<a class=\"pcard\" href=\"#produto/"+encodeURIComponent(p.id)+"\">" +
    "<div class=\"imgwrap\">" +
    (img ? ("<img src=\""+esc(img)+"\" alt=\""+esc(p.name)+"\" loading=\"lazy\">") : "<span class=\"noimg\">sem foto</span>") +
    (!p.in_stock ? "<span class=\"badge-oos\">Sem estoque</span>" : "") +
    (p.promo_price ? "<span class=\"badge-promo\">Promocao</span>" : "") +
    "</div>" +
    "<div class=\"info\">" +
    "<div class=\"pname\">"+esc(p.name)+"</div>" +
    "<div class=\"pcat\">"+esc(p.category||"")+(p.brand?(" &middot; "+esc(p.brand)):"")+"</div>" +
    "<div class=\"pprice\">"+priceHtml+"</div>" +
    "</div></a>";
}

/* ---------- HOME ---------- */

function renderHome(categoryFilter){
  var top = "<header class=\"topbar\"><div class=\"topbar-inner\">" +
    "<h1 onclick=\"window.location.hash='#home'\">"+esc(STORE_NAME)+"</h1>" +
    "<div class=\"searchbox\"><input id=\"search-input\" placeholder=\"Buscar produtos...\" oninput=\"onSearchInput(this.value)\"></div>" +
    "</div></header>";

  var searchTerm = document.getElementById("search-input") ? document.getElementById("search-input").value.trim().toLowerCase() : "";

  var categories = [];
  products.forEach(function(p){ if(p.category && categories.indexOf(p.category)===-1) categories.push(p.category); });

  var hero = "<div class=\"hero\"><h2>Confira nossas pecas</h2><p>Novidades toda semana, direto da Korpa pra voce.</p></div>";

  var body = "";

  if(searchTerm){
    var results = visibleProducts(products.filter(function(p){
      return (p.name||"").toLowerCase().indexOf(searchTerm)>-1 || (p.category||"").toLowerCase().indexOf(searchTerm)>-1 || (p.brand||"").toLowerCase().indexOf(searchTerm)>-1;
    }));
    body = "<div class=\"wrap\">" + renderFilterBar(categoryFilter, categories) +
      "<div class=\"section-title\"><h3>Resultado para \""+esc(searchTerm)+"\"</h3></div>" +
      (results.length ? ("<div class=\"grid\">"+results.map(productCardHtml).join("")+"</div>") : "<div class=\"empty\">Nenhum produto encontrado.</div>") +
      "</div>";
    document.getElementById("app").innerHTML = top + body + renderFooter();
    return;
  }

  if(categoryFilter){
    var catResults = visibleProducts(products.filter(function(p){ return p.category===categoryFilter; }));
    body = "<div class=\"wrap\">" + renderFilterBar(categoryFilter, categories) +
      "<div class=\"section-title\"><h3>"+esc(categoryFilter)+"</h3></div>" +
      (catResults.length ? ("<div class=\"grid\">"+catResults.map(productCardHtml).join("")+"</div>") : "<div class=\"empty\">Nenhum produto nessa categoria no momento.</div>") +
      "</div>";
    document.getElementById("app").innerHTML = top + body + renderFooter();
    return;
  }

  var featured = visibleProducts(products.filter(function(p){ return p.featured; }));
  var promos = visibleProducts(products.filter(function(p){ return p.promo_price; }));
  var recent = visibleProducts(products.slice(0,10));

  body = "<div class=\"wrap\">";
  body += renderFilterBar(null, categories);

  if(featured.length){
    body += "<div class=\"section-title\"><h3>Destaques</h3></div><div class=\"grid\">"+featured.map(productCardHtml).join("")+"</div>";
  }
  if(promos.length){
    body += "<div class=\"section-title\"><h3>Promocoes</h3></div><div class=\"grid\">"+promos.map(productCardHtml).join("")+"</div>";
  }
  body += "<div class=\"section-title\"><h3>Lancamentos</h3></div>" +
    (recent.length ? ("<div class=\"grid\">"+recent.map(productCardHtml).join("")+"</div>") : "<div class=\"empty\">Nenhum produto publicado no catalogo ainda.</div>");
  body += "</div>";

  document.getElementById("app").innerHTML = top + hero + body + renderFooter();
}

function renderFilterBar(activeCategory, categories){
  var chips = "<span class=\"chip"+(!activeCategory?" active":"")+"\" onclick=\"window.location.hash='#home'\">Todas</span>" +
    categories.map(function(c){
      return "<span class=\"chip"+(activeCategory===c?" active":"")+"\" onclick=\"window.location.hash='#categoria/"+encodeURIComponent(c)+"'\">"+esc(c)+"</span>";
    }).join("");
  return "<div class=\"chipsrow\">"+chips+"</div>";
}

function renderFooter(){
  return "<div class=\"footer\">"+esc(STORE_NAME)+" &middot; Catalogo online</div>";
}

var searchDebounce = null;
function onSearchInput(val){
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(function(){ renderHome(null); document.getElementById("search-input").focus(); document.getElementById("search-input").value = val; document.getElementById("search-input").setSelectionRange(val.length,val.length); }, 200);
}

/* ---------- PRODUCT PAGE ---------- */

function renderProductPage(id){
  var p = products.find(function(x){ return x.id===id; });
  var top = "<header class=\"topbar\"><div class=\"topbar-inner\">" +
    "<h1 onclick=\"window.location.hash='#home'\">"+esc(STORE_NAME)+"</h1>" +
    "<div class=\"searchbox\"><input placeholder=\"Buscar produtos...\" onfocus=\"window.location.hash='#home'\"></div>" +
    "</div></header>";

  if(!p){
    document.getElementById("app").innerHTML = top + "<div class=\"wrap\"><div class=\"empty\">Produto nao encontrado ou nao esta mais disponivel.</div></div>" + renderFooter();
    return;
  }

  galleryIndex = 0;
  var images = (p.images && p.images.length) ? p.images : [null];

  var related = visibleProducts(products.filter(function(x){ return x.id!==p.id && x.category && x.category===p.category; })).slice(0,6);

  document.title = p.name + " - " + STORE_NAME;

  var body = "<div class=\"wrap\">" +
    "<span class=\"backlink\" onclick=\"window.location.hash='#home'\">&larr; Voltar ao catalogo</span>" +
    "<div class=\"detail\">" +
    "<div>" +
    "<div class=\"gallery-main\" id=\"gallery-main\">" + (images[0] ? ("<img src=\""+esc(images[0])+"\" id=\"gallery-main-img\">") : "<span class=\"noimg\" style=\"display:flex;align-items:center;justify-content:center;height:100%;\">sem foto</span>") + "</div>" +
    (images.length>1 ? ("<div class=\"gallery-thumbs\">"+images.map(function(url,idx){ return url ? ("<img src=\""+esc(url)+"\" class=\""+(idx===0?"active":"")+"\" onclick=\"setGalleryImage("+idx+")\" data-idx=\""+idx+"\">") : ""; }).join("")+"</div>") : "") +
    "</div>" +
    "<div>" +
    "<h2>"+esc(p.name)+"</h2>" +
    "<div class=\"muted\">"+esc(p.category||"")+(p.brand?(" &middot; "+esc(p.brand)):"")+"</div>" +
    "<div class=\"price\">" + (p.promo_price ? ("<span class=\"old\">"+brl(p.price)+"</span>"+brl(p.promo_price)) : brl(p.price)) + "</div>" +
    (!p.in_stock ? "<div style=\"color:var(--danger);font-weight:bold;\">Sem estoque no momento</div>" : "") +
    ((p.variations && p.variations.length) ? ("<div class=\"sizerow\">"+p.variations.map(function(v){
      return "<span class=\"sizechip"+(v.available?"":" unavailable")+"\">"+esc(v.size||"")+(v.color?(" / "+esc(v.color)):"")+"</span>";
    }).join("")+"</div>") : "") +
    (p.description ? ("<p>"+esc(p.description).replace(/\n/g,"<br>")+"</p>") : "") +
    (p.specs ? ("<h3 style=\"font-size:15px;margin-top:16px;\">Especificacoes</h3><p class=\"muted\">"+esc(p.specs).replace(/\n/g,"<br>")+"</p>") : "") +
    "<div>" +
    (WHATSAPP_NUMBER ? ("<button class=\"actionbtn\" onclick=\"contactWhatsapp('"+esc(p.name).replace(/'/g,"")+"')\">Tenho interesse</button>") : "") +
    "<button class=\"actionbtn ghost\" onclick=\"shareProduct('"+esc(p.name).replace(/'/g,"")+"')\">Compartilhar</button>" +
    "</div>" +
    "</div>" +
    "</div>" +
    (related.length ? ("<div class=\"section-title\"><h3>Voce tambem pode gostar</h3></div><div class=\"grid\">"+related.map(productCardHtml).join("")+"</div>") : "") +
    "</div>";

  document.getElementById("app").innerHTML = top + body + renderFooter();
}

function setGalleryImage(idx){
  var p = products.find(function(x){ return "#produto/"+encodeURIComponent(x.id) === window.location.hash; });
  if(!p) return;
  var images = p.images || [];
  if(!images[idx]) return;
  document.getElementById("gallery-main").innerHTML = "<img src=\""+esc(images[idx])+"\" id=\"gallery-main-img\">";
  document.querySelectorAll(".gallery-thumbs img").forEach(function(img,i){ img.classList.toggle("active", i===idx); });
}
function contactWhatsapp(productName){
  var msg = encodeURIComponent("Ola! Tenho interesse na peca: " + productName);
  window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+msg, "_blank");
}
function shareProduct(productName){
  var url = window.location.href;
  if(navigator.share){
    navigator.share({title: productName + " - " + STORE_NAME, url: url}).catch(function(){});
  } else {
    navigator.clipboard.writeText(url).then(function(){ alert("Link copiado!"); }).catch(function(){ prompt("Copie o link:", url); });
  }
}

/* ---------- BOOTSTRAP + LIGHT AUTO-REFRESH ---------- */

loadProducts();
setInterval(function(){ if(document.visibilityState==="visible") loadProducts(); }, 60000);
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible" && loaded) loadProducts(); });
</script>
</body>
</html>
