<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korpa - Catálogo</title>
<meta name="description" content="Confira as peças fitness disponíveis na Korpa.">
<meta property="og:title" content="Korpa - Catálogo">
<meta property="og:description" content="Confira as peças fitness disponíveis na Korpa.">
<meta property="og:type" content="website">
<style>
:root{--bg:#f8f1e7;--card:#fffdfa;--ink:#3a2e2b;--muted:#756258;--accent:#b76e79;--accent-dark:#8f4f56;--danger:#c0392b;--border:#ecdfd0;}
*{box-sizing:border-box;}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:0 0 8px;}
a{color:inherit;text-decoration:none;}
.topbar{background:var(--accent-dark);color:#fff;padding:16px 24px;position:sticky;top:0;z-index:10;}
.topbar-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.topbar h1{font-size:22px;margin:0;cursor:pointer;}
.searchbox{flex:1;max-width:360px;}
.searchbox input{width:100%;padding:9px 12px;border-radius:20px;border:none;font-size:14px;}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;padding:48px 24px;text-align:center;}
.hero h2{font-size:30px;color:#fff;}
.hero p{font-size:15px;opacity:0.9;margin-top:4px;}
.wrap{max-width:1200px;margin:0 auto;padding:24px;}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 14px;}
.section-title h3{font-size:20px;}
.section-title a{font-size:13px;color:var(--accent-dark);}
.chipsrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.chip{background:var(--card);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;}
.chip.active{background:var(--accent-dark);color:#fff;border-color:var(--accent-dark);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s;}
.pcard:hover{transform:translateY(-3px);}
.pcard .imgwrap{aspect-ratio:1/1;background:#f1e9dc;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.pcard img{width:100%;height:100%;object-fit:cover;}
.pcard .noimg{color:var(--muted);font-size:12px;}
.pcard .badge-oos{position:absolute;top:8px;left:8px;background:var(--danger);color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;}
.pcard .badge-promo{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;}
.pcard .info{padding:10px 12px;}
.pcard .pname{font-size:14px;font-weight:bold;margin-bottom:4px;min-height:34px;}
.pcard .pcat{font-size:11px;color:var(--muted);}
.pcard .pprice{margin-top:6px;font-size:15px;font-weight:bold;color:var(--accent-dark);}
.pcard .pprice .old{font-size:12px;color:var(--muted);text-decoration:line-through;font-weight:normal;margin-right:6px;}
.filtersbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filtersbar select,.filtersbar input{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;}
.muted{color:var(--muted);}
.empty{text-align:center;padding:40px;color:var(--muted);}
.footer{text-align:center;padding:30px;color:var(--muted);font-size:13px;}
/* product detail */
.detail{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
.gallery-main{aspect-ratio:1/1;background:#f1e9dc;border-radius:10px;overflow:hidden;margin-bottom:10px;}
.gallery-main img{width:100%;height:100%;object-fit:cover;}
.gallery-thumbs{display:flex;gap:8px;flex-wrap:wrap;}
.gallery-thumbs img{width:60px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;}
.gallery-thumbs img.active{border-color:var(--accent-dark);}
.detail h2{font-size:26px;}
.detail .price{font-size:26px;font-weight:bold;color:var(--accent-dark);margin:10px 0;}
.detail .price .old{font-size:15px;color:var(--muted);text-decoration:line-through;font-weight:normal;margin-right:8px;}
.sizerow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
.sizechip{border:1px solid var(--border);padding:6px 12px;border-radius:6px;font-size:13px;}
.sizechip.unavailable{color:var(--muted);text-decoration:line-through;background:#f4efe8;}
.actionbtn{background:var(--accent-dark);color:#fff;border:none;padding:12px 20px;border-radius:6px;cursor:pointer;font-size:15px;margin-top:14px;margin-right:8px;}
.actionbtn.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent-dark);}
.backlink{display:inline-block;margin-bottom:16px;color:var(--accent-dark);cursor:pointer;font-size:14px;}
@media(max-width:720px){
  .detail{grid-template-columns:1fr;}
  .hero h2{font-size:22px;}
  .wrap{padding:14px;}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .pcard .info{padding:8px 9px;}
  .pcard .pname{font-size:12.5px;}
}

.cart-btn{position:relative;background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 12px;border-radius:20px;cursor:pointer;font-size:16px;display:flex;align-items:center;transition:background .2s;}
.cart-btn:hover{background:rgba(255,255,255,.28);}
.cart-badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;font-weight:bold;}
.cart-badge.bump{animation:bump .3s ease;}
@keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.4);}100%{transform:scale(1);}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.pcard{animation:fadeInUp .35s ease both;}
.pcard .imgwrap img{transition:transform .35s ease;}
.pcard:hover .imgwrap img{transform:scale(1.06);}
.actionbtn{transition:transform .15s ease,filter .15s ease;}
.actionbtn:hover{filter:brightness(1.08);transform:translateY(-1px);}
.actionbtn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none;}
.sizechip{cursor:pointer;transition:all .15s ease;}
.sizechip.selected{background:var(--accent-dark);color:#fff;border-color:var(--accent-dark);}
.sizechip.unavailable{cursor:not-allowed;}
.qtyrow{display:flex;align-items:center;gap:10px;margin:14px 0 4px;}
.qtyrow button{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:16px;transition:background .15s;}
.qtyrow button:hover{background:var(--bg);}
.qtyrow input{width:44px;text-align:center;border:1px solid var(--border);border-radius:6px;padding:7px 4px;font-size:14px;}
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:150;}
.cart-overlay.open{opacity:1;pointer-events:auto;}
.cart-drawer{position:fixed;top:0;right:0;width:380px;max-width:92vw;height:100%;background:#fff;box-shadow:-6px 0 30px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .3s ease;z-index:151;display:flex;flex-direction:column;}
.cart-drawer.open{transform:translateX(0);}
.cart-drawer-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);}
.cart-drawer-head h3{font-size:18px;}
.cart-close{cursor:pointer;font-size:24px;color:var(--muted);line-height:1;}
.cart-items{flex:1;overflow-y:auto;padding:6px 18px;}
.cart-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);animation:fadeInUp .25s ease both;}
.ci-img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#f1e9dc;flex-shrink:0;}
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:13px;font-weight:bold;}
.ci-variation{font-size:11px;}
.ci-price{font-size:12px;color:var(--accent-dark);margin-top:2px;}
.ci-qtyrow{display:flex;align-items:center;gap:8px;margin-top:6px;}
.ci-qtyrow button{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;line-height:1;}
.ci-remove{color:var(--danger);font-size:12px;cursor:pointer;margin-left:auto;}
.cart-footer{padding:16px 18px;border-top:1px solid var(--border);}
.cart-subtotal{font-size:15px;font-weight:bold;margin-bottom:10px;display:flex;justify-content:space-between;}
.cart-footer .actionbtn{width:100%;margin:0;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:8px;font-size:14px;opacity:0;transition:all .3s ease;z-index:200;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:80vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.color-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid rgba(0,0,0,.2);flex-shrink:0;}
.sizechip{display:inline-flex;align-items:center;}
.ci-variation{display:flex;align-items:center;}

.pix-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:299;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.pix-modal-overlay.show{opacity:1;pointer-events:auto;}
.pix-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-40%);width:92%;max-width:380px;background:var(--card);border-radius:12px;z-index:300;opacity:0;pointer-events:none;transition:all .25s ease;max-height:86vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.3);}
.pix-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);}
.pix-modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);}
.pix-modal-head h3{font-size:17px;}
.pix-modal-body{padding:16px 18px;}
.pix-modal-body label{display:block;font-size:13px;margin:10px 0 4px;color:var(--muted);}
.pix-modal-body input{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:14px;}
.actionbtn.pix{background:#32BCAD;}
.pix-error{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;}
.pix-qr-wrap{text-align:center;margin:10px 0;}
.pix-qr-wrap img{width:200px;height:200px;border:1px solid var(--border);border-radius:8px;}
#pix-copy-text{width:100%;height:70px;font-size:11px;padding:8px;border:1px solid var(--border);border-radius:6px;resize:none;margin-top:8px;}
.pix-status{margin-top:12px;font-size:13px;text-align:center;color:var(--muted);}

.avise-btn{margin-top:6px;width:100%;padding:6px 8px;font-size:11.5px;border:1px solid var(--accent);background:#fff;color:var(--accent-dark);border-radius:8px;cursor:pointer;}
.avise-btn:hover{background:var(--accent);color:#fff;}
.actionbtn.avise{background:#fff;color:var(--accent-dark);border:1px solid var(--accent-dark);}
.avise-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:299;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.avise-modal-overlay.show{opacity:1;pointer-events:auto;}
.avise-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-40%);width:92%;max-width:380px;background:var(--card);border-radius:12px;z-index:300;opacity:0;pointer-events:none;transition:all .25s ease;max-height:86vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.3);}
.avise-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);}
.avise-modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);}
.avise-modal-head h3{font-size:17px;margin:0;}
.avise-modal-body{padding:16px 18px;}
.avise-modal-body label{display:block;font-size:13px;margin:10px 0 4px;color:var(--muted);}
.avise-modal-body input{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:14px;box-sizing:border-box;}
.avise-error{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;}
.avise-success{color:#1b7f3a;font-size:14px;padding:6px 0;}
</style>
</head>
<body>
<div id="app"><div class="wrap">Carregando catálogo...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL = "https://sksqtrlqbcaazsreqdps.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrc3F0cmxxYmNhYXpzcmVxZHBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzOTA3NTksImV4cCI6MjA5OTk2Njc1OX0.GHfc89i3Lw5te62l6errMN3Ms_W5Bsu8jguATBe2D38";
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var STORE_NAME = "Korpa";
var WHATSAPP_NUMBER = "5585920064349"; // ex: "5585999999999" - opcional, deixa vazio para ocultar o botão de interesse via WhatsApp
var EDGE_FUNCTIONS_BASE = SUPABASE_URL + "/functions/v1";
var pixPollTimer = null;
var pixCurrentPaymentId = null;

var products = [];
var loaded = false;
var galleryIndex = 0;

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function brl(n){ return "R$ " + Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }

async function loadProducts(){
  var res = await sb.from("catalog_products").select("*").order("created_at", {ascending:false});
  if(res.error){
    document.getElementById("app").innerHTML = "<div class=\"wrap\"><p>Não foi possível carregar o catálogo agora. Tente novamente em instantes.</p></div>";
    console.error(res.error);
    return;
  }
  products = res.data || [];
  loaded = true;
  route();
}

/* ---------- ROUTING (hash based, static hosting friendly) ---------- */

function route(){
  var hash = window.location.hash || "#home";
  if(hash.indexOf("#produto/") === 0){
    renderProductPage(hash.replace("#produto/",""));
  } else if(hash.indexOf("#categoria/") === 0){
    renderHome(decodeURIComponent(hash.replace("#categoria/","")));
  } else {
    renderHome(null);
  }
  renderCartBadge();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ---------- HELPERS ---------- */

function visibleProducts(list){
  return list.filter(function(p){ return p.in_stock || !p.hide_when_out_of_stock; });
}
function productCardHtml(p){
  var img = (p.images && p.images.length) ? p.images[0] : null;
  var priceHtml = p.promo_price ? ("<span class=\"old\">"+brl(p.price)+"</span>"+brl(p.promo_price)) : brl(p.price);
  return "<a class=\"pcard\" href=\"#produto/"+encodeURIComponent(p.id)+"\">" +
    "<div class=\"imgwrap\">" +
    (img ? ("<img src=\""+esc(img)+"\" alt=\""+esc(p.name)+"\" loading=\"lazy\">") : "<span class=\"noimg\">sem foto</span>") +
    (!p.in_stock ? "<span class=\"badge-oos\">Sem estoque</span>" : "") +
    (p.promo_price ? "<span class=\"badge-promo\">Promoção</span>" : "") +
    "</div>" +
    "<div class=\"info\">" +
    "<div class=\"pname\">"+esc(p.name)+"</div>" +
    "<div class=\"pcat\">"+esc(p.category||"")+(p.brand?(" &middot; "+esc(p.brand)):"")+"</div>" +
    "<div class=\"pprice\">"+priceHtml+"</div>" +
    (!p.in_stock ? ("<button class=\"avise-btn\" onclick=\"event.preventDefault();event.stopPropagation();openAviseModal('"+esc(p.id)+"','"+esc(p.name).replace(/'/g,"")+"')\">Avise-me</button>") : "") +
    "</div></a>";
}

/* ---------- HOME ---------- */

function renderHome(categoryFilter){
  var top = "<header class=\"topbar\"><div class=\"topbar-inner\">" +
    "<h1 onclick=\"window.location.hash='#home'\">"+esc(STORE_NAME)+"</h1>" +
    "<button class=\"cart-btn\" onclick=\"toggleCart(true)\">🛒<span class=\"cart-badge\" id=\"cart-badge\">0</span></button>" +
    "<div class=\"searchbox\"><input id=\"search-input\" placeholder=\"Buscar produtos...\" oninput=\"onSearchInput(this.value)\"></div>" +
    "</div></header>";

  var searchTerm = document.getElementById("search-input") ? document.getElementById("search-input").value.trim().toLowerCase() : "";

  var categories = [];
  products.forEach(function(p){ if(p.category && categories.indexOf(p.category)===-1) categories.push(p.category); });

  var hero = "<div class=\"hero\"><h2>Confira nossas peças</h2><p>Novidades toda semana, direto da Korpa para você.</p></div>";

  var body = "";

  if(searchTerm){
    var results = visibleProducts(products.filter(function(p){
      return (p.name||"").toLowerCase().indexOf(searchTerm)>-1 || (p.category||"").toLowerCase().indexOf(searchTerm)>-1 || (p.brand||"").toLowerCase().indexOf(searchTerm)>-1;
    }));
    body = "<div class=\"wrap\">" + renderFilterBar(categoryFilter, categories) +
      "<div class=\"section-title\"><h3>Resultado para \""+esc(searchTerm)+"\"</h3></div>" +
      (results.length ? ("<div class=\"grid\">"+results.map(productCardHtml).join("")+"</div>") : "<div class=\"empty\">Nenhum produto encontrado.</div>") +
      "</div>";
    document.getElementById("app").innerHTML = top + body + renderFooter();
    return;
  }

  if(categoryFilter){
    var catResults = visibleProducts(products.filter(function(p){ return p.category===categoryFilter; }));
    body = "<div class=\"wrap\">" + renderFilterBar(categoryFilter, categories) +
      "<div class=\"section-title\"><h3>"+esc(categoryFilter)+"</h3></div>" +
      (catResults.length ? ("<div class=\"grid\">"+catResults.map(productCardHtml).join("")+"</div>") : "<div class=\"empty\">Nenhum produto nessa categoria no momento.</div>") +
      "</div>";
    document.getElementById("app").innerHTML = top + body + renderFooter();
    return;
  }

  var featured = visibleProducts(products.filter(function(p){ return p.featured; }));
  var promos = visibleProducts(products.filter(function(p){ return p.promo_price; }));
  var recent = visibleProducts(products.slice(0,10));

  body = "<div class=\"wrap\">";
  body += renderFilterBar(null, categories);

  if(featured.length){
    body += "<div class=\"section-title\"><h3>Destaques</h3></div><div class=\"grid\">"+featured.map(productCardHtml).join("")+"</div>";
  }
  if(promos.length){
    body += "<div class=\"section-title\"><h3>Promoções</h3></div><div class=\"grid\">"+promos.map(productCardHtml).join("")+"</div>";
  }
  body += "<div class=\"section-title\"><h3>Lançamentos</h3></div>" +
    (recent.length ? ("<div class=\"grid\">"+recent.map(productCardHtml).join("")+"</div>") : "<div class=\"empty\">Nenhum produto publicado no catálogo ainda.</div>");
  body += "</div>";

  document.getElementById("app").innerHTML = top + hero + body + renderFooter();
}

function renderFilterBar(activeCategory, categories){
  var chips = "<span class=\"chip"+(!activeCategory?" active":"")+"\" onclick=\"window.location.hash='#home'\">Todas</span>" +
    categories.map(function(c){
      return "<span class=\"chip"+(activeCategory===c?" active":"")+"\" onclick=\"window.location.hash='#categoria/"+encodeURIComponent(c)+"'\">"+esc(c)+"</span>";
    }).join("");
  return "<div class=\"chipsrow\">"+chips+"</div>";
}

function renderFooter(){
  return "<div class=\"footer\">"+esc(STORE_NAME)+" &middot; Catálogo online</div>";
}

var searchDebounce = null;
function onSearchInput(val){
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(function(){ renderHome(null); renderCartBadge(); document.getElementById("search-input").focus(); document.getElementById("search-input").value = val; document.getElementById("search-input").setSelectionRange(val.length,val.length); }, 200);
}

/* ---------- PRODUCT PAGE ---------- */

function renderProductPage(id){
  var p = products.find(function(x){ return x.id===id; });
  var top = "<header class=\"topbar\"><div class=\"topbar-inner\">" +
    "<h1 onclick=\"window.location.hash='#home'\">"+esc(STORE_NAME)+"</h1>" +
    "<button class=\"cart-btn\" onclick=\"toggleCart(true)\">🛒<span class=\"cart-badge\" id=\"cart-badge\">0</span></button>" +
    "<div class=\"searchbox\"><input placeholder=\"Buscar produtos...\" onfocus=\"window.location.hash='#home'\"></div>" +
    "</div></header>";

  if(!p){
    document.getElementById("app").innerHTML = top + "<div class=\"wrap\"><div class=\"empty\">Produto não encontrado ou não está mais disponível.</div></div>" + renderFooter();
    return;
  }

  galleryIndex = 0;
  selectedVariationIdx = null;
  var images = (p.images && p.images.length) ? p.images : [null];

  var related = visibleProducts(products.filter(function(x){ return x.id!==p.id && x.category && x.category===p.category; })).slice(0,6);

  document.title = p.name + " - " + STORE_NAME;

  var body = "<div class=\"wrap\">" +
    "<span class=\"backlink\" onclick=\"window.location.hash='#home'\">&larr; Voltar ao catálogo</span>" +
    "<div class=\"detail\">" +
    "<div>" +
    "<div class=\"gallery-main\" id=\"gallery-main\">" + (images[0] ? ("<img src=\""+esc(images[0])+"\" id=\"gallery-main-img\">") : "<span class=\"noimg\" style=\"display:flex;align-items:center;justify-content:center;height:100%;\">sem foto</span>") + "</div>" +
    (images.length>1 ? ("<div class=\"gallery-thumbs\">"+images.map(function(url,idx){ return url ? ("<img src=\""+esc(url)+"\" class=\""+(idx===0?"active":"")+"\" onclick=\"setGalleryImage("+idx+")\" data-idx=\""+idx+"\">") : ""; }).join("")+"</div>") : "") +
    "</div>" +
    "<div>" +
    "<h2>"+esc(p.name)+"</h2>" +
    "<div class=\"muted\">"+esc(p.category||"")+(p.brand?(" &middot; "+esc(p.brand)):"")+"</div>" +
    "<div class=\"price\">" + (p.promo_price ? ("<span class=\"old\">"+brl(p.price)+"</span>"+brl(p.promo_price)) : brl(p.price)) + "</div>" +
    (!p.in_stock ? "<div style=\"color:var(--danger);font-weight:bold;\">Sem estoque no momento</div>" : "") +
    ((p.variations && p.variations.length) ? ("<div class=\"sizerow\">"+p.variations.map(function(v,vi){
      return "<span class=\"sizechip"+(v.available?"":" unavailable")+"\" data-vi=\""+vi+"\" onclick=\""+(v.available?("selectVariation("+vi+")"):"")+"\">"+colorDotHtml(v.color)+esc(v.size||"")+(v.color?(" / "+esc(v.color)):"")+"</span>";
    }).join("")+"</div>") : "") +
    (p.description ? ("<p>"+esc(p.description).replace(/\n/g,"<br>")+"</p>") : "") +
    (p.specs ? ("<h3 style=\"font-size:15px;margin-top:16px;\">Especificações</h3><p class=\"muted\">"+esc(p.specs).replace(/\n/g,"<br>")+"</p>") : "") +
    (p.in_stock ? ("<div class=\"qtyrow\"><button onclick=\"stepQty(-1)\">-</button><input id=\"qty-input\" value=\"1\" readonly><button onclick=\"stepQty(1)\">+</button></div>") : "") +
    "<div>" +
    (p.in_stock ? ("<button class=\"actionbtn\" onclick=\"addToCart('"+esc(p.id)+"')\">Adicionar ao carrinho</button>") : "") +
    ((!p.in_stock ? ("<button class=\"actionbtn avise\" onclick=\"openAviseModal('"+esc(p.id)+"','"+esc(p.name).replace(/'/g,"")+"')\">Avise-me quando chegar</button>") : "") +
    WHATSAPP_NUMBER ? ("<button class=\"actionbtn ghost\" onclick=\"contactWhatsapp('"+esc(p.name).replace(/'/g,"")+"')\">Tenho interesse</button>") : "") +
    "<button class=\"actionbtn ghost\" onclick=\"shareProduct('"+esc(p.name).replace(/'/g,"")+"')\">Compartilhar</button>" +
    "</div>" +
    "</div>" +
    "</div>" +
    (related.length ? ("<div class=\"section-title\"><h3>Você também pode gostar</h3></div><div class=\"grid\">"+related.map(productCardHtml).join("")+"</div>") : "") +
    "</div>";

  document.getElementById("app").innerHTML = top + body + renderFooter();
}

function setGalleryImage(idx){
  var p = products.find(function(x){ return "#produto/"+encodeURIComponent(x.id) === window.location.hash; });
  if(!p) return;
  var images = p.images || [];
  if(!images[idx]) return;
  document.getElementById("gallery-main").innerHTML = "<img src=\""+esc(images[idx])+"\" id=\"gallery-main-img\">";
  document.querySelectorAll(".gallery-thumbs img").forEach(function(img,i){ img.classList.toggle("active", i===idx); });
}
function contactWhatsapp(productName){
  var msg = encodeURIComponent("Olá! Tenho interesse na peça: " + productName);
  window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+msg, "_blank");
}
function shareProduct(productName){
  var url = window.location.href;
  if(navigator.share){
    navigator.share({title: productName + " - " + STORE_NAME, url: url}).catch(function(){});
  } else {
    navigator.clipboard.writeText(url).then(function(){ alert("Link copiado!"); }).catch(function(){ prompt("Copie o link:", url); });
  }
}


/* ---------- CART ---------- */
function colorNameToHex(name){
  if(!name) return null;
  var n = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  var map = [
    [["marinho"], "#1b2a4a"],
    [["preto","black"], "#111111"],
    [["off white","offwhite","branco"], "#f5f5f2"],
    [["cinza","grafite","chumbo"], "#8a8a8a"],
    [["azul"], "#2f5aa8"],
    [["vinho","bordo","vermelho"], "#8b2635"],
    [["verde"], "#2f6e46"],
    [["amarelo"], "#e0c341"],
    [["rosa","pink"], "#e2879e"],
    [["roxo","lilas","lavanda"], "#7a5aa8"],
    [["laranja"], "#d97b34"],
    [["bege"], "#d8c3a0"],
    [["marrom","caramelo","chocolate"], "#6b4a34"],
    [["nude"], "#dcb28c"],
    [["dourado","ouro"], "#c9a227"],
    [["prata","prateado"], "#b8bcc2"],
    [["caqui","khaki"], "#a89f6b"],
    [["jeans","denim"], "#4c6b8a"]
  ];
  for(var i=0;i<map.length;i++){
    for(var k=0;k<map[i][0].length;k++){
      if(n.indexOf(map[i][0][k])>-1) return map[i][1];
    }
  }
  return null;
}
function colorDotHtml(colorName){
  var hex = colorNameToHex(colorName);
  return hex ? ("<span class=\"color-dot\" style=\"background:"+hex+";\"></span>") : "";
}

var cart = [];
try { cart = JSON.parse(localStorage.getItem("korpa_cart") || "[]"); } catch(e){ cart = []; }
var selectedVariationIdx = null;

function saveCart(){ localStorage.setItem("korpa_cart", JSON.stringify(cart)); }
function cartCount(){ return cart.reduce(function(s,i){ return s+i.qty; }, 0); }
function cartTotal(){ return cart.reduce(function(s,i){ return s+i.qty*i.unitPrice; }, 0); }

function stepQty(delta){
  var el = document.getElementById("qty-input");
  if(!el) return;
  var v = (parseInt(el.value,10)||1) + delta;
  if(v<1) v = 1;
  if(v>99) v = 99;
  el.value = v;
}

function selectVariation(idx){
  var p = currentProduct();
  if(!p || !p.variations || !p.variations[idx] || !p.variations[idx].available) return;
  selectedVariationIdx = idx;
  document.querySelectorAll(".sizechip").forEach(function(el){
    el.classList.toggle("selected", Number(el.getAttribute("data-vi"))===idx);
  });
  applyColorImage(p, p.variations[idx].color);
}
function applyColorImage(p, color){
  if(!color) return;
  var match = (p.color_images||[]).find(function(ci){ return ci.color===color; });
  if(!match || !match.image) return;
  var mainEl = document.getElementById("gallery-main");
  if(mainEl){ mainEl.innerHTML = "<img src=\"" + esc(match.image) + "\" id=\"gallery-main-img\">"; }
  document.querySelectorAll(".gallery-thumbs img").forEach(function(img){ img.classList.remove("active"); });
}


function currentProduct(){
  var hash = window.location.hash || "";
  if(hash.indexOf("#produto/")!==0) return null;
  var id = hash.replace("#produto/","");
  return products.find(function(x){ return x.id===id; }) || null;
}

function addToCart(productId){
  var p = products.find(function(x){ return x.id===productId; });
  if(!p) return;
  if(!p.in_stock){ showToast("Produto sem estoque no momento."); return; }
  var variation = null;
  var colorRaw = null;
  if(p.variations && p.variations.length){
    if(selectedVariationIdx===null || selectedVariationIdx===undefined){ showToast("Selecione um tamanho/cor antes de adicionar."); return; }
    var v = p.variations[selectedVariationIdx];
    if(!v || !v.available){ showToast("Essa opção está indisponível."); return; }
    variation = (v.size||"") + (v.color ? (" / "+v.color) : "");
    colorRaw = v.color || null;
  }
  var qtyEl = document.getElementById("qty-input");
  var qty = qtyEl ? (parseInt(qtyEl.value,10)||1) : 1;
  var key = p.id + "|" + (variation||"");
  var existing = cart.find(function(c){ return c.key===key; });
  if(existing){ existing.qty += qty; } else {
    cart.push({ key:key, id:p.id, name:p.name, unitPrice:(p.promo_price||p.price), variation:variation, color:colorRaw, image:(p.images&&p.images[0])||null, qty:qty });
  }
  saveCart();
  renderCartBadge(true);
  showToast("Produto adicionado ao carrinho!");
}

function updateCartQty(idx, delta){
  if(!cart[idx]) return;
  cart[idx].qty += delta;
  if(cart[idx].qty<=0) cart.splice(idx,1);
  saveCart();
  renderCartItems();
  renderCartBadge();
}
function removeCartItem(idx){
  cart.splice(idx,1);
  saveCart();
  renderCartItems();
  renderCartBadge();
}

function cartItemHtml(item, idx){
  return "<div class=\"cart-item\">" +
    (item.image ? ("<img src=\""+esc(item.image)+"\" class=\"ci-img\">") : "<div class=\"ci-img\"></div>") +
    "<div class=\"ci-info\">" +
    "<div class=\"ci-name\">"+esc(item.name)+"</div>" +
    (item.variation ? ("<div class=\"ci-variation muted\">"+colorDotHtml(item.color)+esc(item.variation)+"</div>") : "") +
    "<div class=\"ci-price\">"+brl(item.unitPrice)+"</div>" +
    "<div class=\"ci-qtyrow\">" +
    "<button onclick=\"updateCartQty("+idx+",-1)\">-</button>" +
    "<span>"+item.qty+"</span>" +
    "<button onclick=\"updateCartQty("+idx+",1)\">+</button>" +
    "<span class=\"ci-remove\" onclick=\"removeCartItem("+idx+")\">Remover</span>" +
    "</div></div></div>";
}

function renderCartItems(){
  var wrap = document.getElementById("cart-items");
  if(!wrap) return;
  wrap.innerHTML = cart.length ? cart.map(cartItemHtml).join("") : "<div class=\"empty\">Seu carrinho está vazio.</div>";
  var totalEl = document.getElementById("cart-total");
  if(totalEl) totalEl.textContent = brl(cartTotal());
  var btn = document.getElementById("cart-checkout-btn");
  if(btn) btn.disabled = cart.length===0;
  var pixBtn = document.getElementById("pix-checkout-btn");
  if(pixBtn) pixBtn.disabled = cart.length===0;
}

function renderCartBadge(bump){
  var badge = document.getElementById("cart-badge");
  if(!badge) return;
  var count = cartCount();
  badge.textContent = count;
  badge.style.display = count>0 ? "flex" : "none";
  if(bump){
    badge.classList.remove("bump");
    void badge.offsetWidth;
    badge.classList.add("bump");
  }
}

function toggleCart(open){
  var drawer = document.getElementById("cart-drawer");
  var overlay = document.getElementById("cart-overlay");
  if(!drawer || !overlay) return;
  drawer.classList.toggle("open", open);
  overlay.classList.toggle("open", open);
  if(open) renderCartItems();
}

function showToast(msg){
  var toast = document.getElementById("toast");
  if(!toast) return;
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ toast.classList.remove("show"); }, 2500);
}

function checkoutCart(){
  if(!cart.length) return;
  if(!WHATSAPP_NUMBER){ showToast("WhatsApp não configurado para finalizar pedidos."); return; }
  var lines = cart.map(function(i){
    return "- "+i.qty+"x "+i.name+(i.variation?(" ("+i.variation+")"):"")+" - "+brl(i.unitPrice*i.qty);
  });
  var msg = "Olá! Gostaria de finalizar este pedido:\n\n" + lines.join("\n") + "\n\nTotal: " + brl(cartTotal());
  window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(msg), "_blank");
  cart = [];
  saveCart();
  renderCartItems();
  renderCartBadge();
  toggleCart(false);
  showToast("Pedido enviado! Aguarde a confirmação pelo WhatsApp.");
}

function openPixModal(){
  if(!cart.length) return;
  document.getElementById("pix-modal-overlay").classList.add("show");
  document.getElementById("pix-modal").classList.add("open");
  document.getElementById("pix-step-form").style.display = "";
  document.getElementById("pix-step-qr").style.display = "none";
  document.getElementById("pix-error").textContent = "";
}
function closePixModal(){
  document.getElementById("pix-modal-overlay").classList.remove("show");
  document.getElementById("pix-modal").classList.remove("open");
  stopPixPolling();
}
var aviseCurrentProduct = null;
function openAviseModal(productId, productName){
  aviseCurrentProduct = {id: productId, name: productName};
  document.getElementById("avise-product-name").textContent = "Produto: " + productName;
  document.getElementById("avise-whatsapp").value = "";
  document.getElementById("avise-error").textContent = "";
  document.getElementById("avise-form-wrap").style.display = "";
  document.getElementById("avise-success").style.display = "none";
  var btn = document.getElementById("avise-submit-btn");
  btn.disabled = false;
  btn.textContent = "Avisar";
  document.getElementById("avise-modal-overlay").classList.add("show");
  document.getElementById("avise-modal").classList.add("open");
}
function closeAviseModal(){
  document.getElementById("avise-modal-overlay").classList.remove("show");
  document.getElementById("avise-modal").classList.remove("open");
}
async function submitAviseMe(){
  var raw = document.getElementById("avise-whatsapp").value.replace(/\D/g,"");
  var errEl = document.getElementById("avise-error");
  errEl.textContent = "";
  if(raw.length < 10 || raw.length > 11){
    errEl.textContent = "Digite um WhatsApp valido com DDD.";
    return;
  }
  var btn = document.getElementById("avise-submit-btn");
  btn.disabled = true;
  btn.textContent = "Enviando...";
  var res = await sb.from("stock_alerts").insert({product_id: aviseCurrentProduct.id, product_name: aviseCurrentProduct.name, whatsapp: raw});
  btn.disabled = false;
  btn.textContent = "Avisar";
  if(res.error && res.error.code !== "23505"){
    errEl.textContent = "Erro ao enviar. Tente novamente.";
    return;
  }
  document.getElementById("avise-form-wrap").style.display = "none";
  document.getElementById("avise-success").style.display = "block";
  setTimeout(closeAviseModal, 3000);
}
function validaCPF(cpf){
  cpf = String(cpf||"").replace(/\D/g,"");
  return cpf.length===11;
}
function submitPixPayment(){
  var name = document.getElementById("pix-name").value.trim();
  var email = document.getElementById("pix-email").value.trim();
  var cpf = document.getElementById("pix-cpf").value.trim();
  var errEl = document.getElementById("pix-error");
  errEl.textContent = "";
  if(!name){ errEl.textContent = "Informe seu nome completo."; return; }
  if(!email || email.indexOf("@")===-1){ errEl.textContent = "Informe um email valido."; return; }
  if(!validaCPF(cpf)){ errEl.textContent = "Informe um CPF valido (11 digitos)."; return; }

  var items = cart.map(function(it){
    return { id: it.id, name: it.name, unitPrice: it.unitPrice, variation: it.variation, color: it.color, qty: it.qty };
  });
  var amount = cartTotal();

  var btn = document.querySelector("#pix-step-form .actionbtn");
  if(btn){ btn.disabled = true; btn.textContent = "Gerando..."; }

  fetch(EDGE_FUNCTIONS_BASE + "/pix-create", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY
    },
    body: JSON.stringify({
      amount: amount,
      description: "Pedido Korpa",
      customer: { name: name, email: email, cpf: cpf },
      items: items
    })
  }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
    .then(function(res){
      if(btn){ btn.disabled = false; btn.textContent = "Gerar Pix"; }
      if(!res.ok){
        errEl.textContent = (res.data && res.data.error) || "Nao foi possivel gerar o pagamento. Tente novamente.";
        return;
      }
      pixCurrentPaymentId = res.data.payment_id;
      document.getElementById("pix-qr-img").src = "data:image/png;base64," + res.data.qr_code_base64;
      document.getElementById("pix-copy-text").value = res.data.qr_code;
      document.getElementById("pix-step-form").style.display = "none";
      document.getElementById("pix-step-qr").style.display = "";
      document.getElementById("pix-status-msg").textContent = "Aguardando confirmacao do pagamento...";
      startPixPolling();
    }).catch(function(){
      if(btn){ btn.disabled = false; btn.textContent = "Gerar Pix"; }
      errEl.textContent = "Erro de conexao. Tente novamente.";
    });
}
function startPixPolling(){
  stopPixPolling();
  var attempts = 0;
  pixPollTimer = setInterval(function(){
    attempts++;
    if(!pixCurrentPaymentId) return;
    fetch(EDGE_FUNCTIONS_BASE + "/pix-status?payment_id=" + encodeURIComponent(pixCurrentPaymentId), {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY }
    }).then(function(r){ return r.json(); }).then(function(data){
      if(data && data.status === "approved"){
        stopPixPolling();
        document.getElementById("pix-status-msg").textContent = "Pagamento confirmado! Obrigado pela compra.";
        cart = [];
        saveCart();
        renderCartItems();
        renderCartBadge();
        showToast("Pagamento Pix confirmado!");
        setTimeout(function(){ closePixModal(); }, 3000);
      } else if(data && (data.status === "rejected" || data.status === "cancelled")){
        stopPixPolling();
        document.getElementById("pix-status-msg").textContent = "Pagamento nao aprovado. Tente novamente ou escolha outra forma de pagamento.";
      }
    }).catch(function(){});
    if(attempts > 200){ stopPixPolling(); }
  }, 4000);
}
function stopPixPolling(){
  if(pixPollTimer){ clearInterval(pixPollTimer); pixPollTimer = null; }
}
function copyPixCode(){
  var ta = document.getElementById("pix-copy-text");
  ta.select();
  ta.setSelectionRange(0, 99999);
  try{ document.execCommand("copy"); showToast("Codigo copiado!"); }catch(e){
    if(navigator.clipboard){ navigator.clipboard.writeText(ta.value); showToast("Codigo copiado!"); }
  }
}
