<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KORPA · Moda Fitness Feminina</title>
<meta name="description" content="Moda fitness feminina KORPA. Entrega própria em Fortaleza e região e envio para todo o Brasil.">
<meta property="og:title" content="KORPA · Moda Fitness Feminina">
<meta property="og:description" content="Moda fitness feminina KORPA. Entrega própria em Fortaleza e região e envio para todo o Brasil.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#E8919F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#E8919F;--pink-dark:#D4707F;--pink-soft:#FDF1F3;--pink-line:#F6D5DB;
  --ink:#111111;--text:#262626;--muted:#737373;--line:#E8E8E8;--soft:#F5F5F3;--banner:#ECEBE7;
  --warn:#E0782E;--danger:#C62828;--ok:#1F8A4C;
  --radius:4px;--wrap:1240px;
  --display:'Archivo',system-ui,sans-serif;--sans:'Archivo',system-ui,-apple-system,Segoe UI,Arial,sans-serif;--logo:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{margin:0;overflow-x:clip;font-family:var(--sans);font-stretch:100%;background:#fff;color:var(--text);font-size:15px;line-height:1.45;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
img{display:block;max-width:100%;}
h1,h2,h3{margin:0;}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px;}
.muted{color:var(--muted);}
.empty{text-align:center;padding:48px 16px;color:var(--muted);}
.display{font-family:var(--display);font-stretch:125%;font-weight:800;letter-spacing:-.01em;color:var(--ink);}

/* barra de aviso */
.adbar{background:var(--pink);color:#fff;font-size:13px;height:32px;overflow:hidden;position:relative;}
.adbar-track{display:flex;justify-content:center;gap:28px;align-items:center;height:32px;}
.adbar-item{display:flex;align-items:center;gap:7px;white-space:nowrap;}
.adbar-item svg{width:15px;height:15px;}

/* cabecalho */
.header{background:#fff;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);}
.header-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:72px;}
.header-left,.header-right{display:flex;align-items:center;gap:6px;}
.header-right{justify-content:flex-end;}
.iconbtn{background:none;border:none;cursor:pointer;width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--ink);border-radius:50%;position:relative;transition:background .15s;}
.iconbtn:hover{background:var(--soft);}
.iconbtn svg{width:22px;height:22px;}
.logo{display:flex;flex-direction:column;align-items:center;cursor:pointer;line-height:1;color:var(--pink);user-select:none;}
.logo-word{font-family:var(--logo);font-weight:500;font-size:34px;letter-spacing:.06em;}
.logo-sub{font-size:9px;letter-spacing:.42em;margin-top:2px;color:var(--pink);text-transform:uppercase;padding-left:.42em;}
.cart-badge{position:absolute;top:4px;right:2px;background:var(--ink);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;font-weight:700;}
.cart-badge.bump{animation:bump .3s ease;}
@keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.4);}100%{transform:scale(1);}}
.nav{display:flex;justify-content:center;gap:36px;height:44px;align-items:center;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;}
.nav>a,.nav>.navdrop>span{cursor:pointer;color:var(--ink);padding:12px 0;display:flex;align-items:center;gap:5px;border-bottom:2px solid transparent;}
.nav>a:hover,.nav>.navdrop:hover>span{border-color:var(--pink);}
.nav>a.active{border-color:var(--pink);}
.navdrop{position:relative;}
.navdrop-menu{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(6px);background:#fff;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.08);min-width:220px;padding:8px 0;opacity:0;pointer-events:none;transition:all .18s ease;text-transform:none;letter-spacing:0;}
.navdrop:hover .navdrop-menu{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
.navdrop-menu a{display:flex;justify-content:space-between;padding:9px 18px;font-size:14px;color:var(--text);}
.navdrop-menu a:hover{background:var(--pink-soft);color:var(--pink-dark);}
.navdrop-menu a small{color:var(--muted);}
.searchbar{border-top:1px solid var(--line);padding:14px 0;display:none;}
.searchbar.open{display:block;}
.searchbar-inner{display:flex;gap:10px;align-items:center;max-width:640px;margin:0 auto;}
.searchbar input{flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:15px;font-family:inherit;outline:none;}
.searchbar input:focus{border-color:var(--pink);}
.only-mobile{display:none!important;}

/* menu lateral (celular) */
.side-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:160;}
.side-overlay.open{opacity:1;pointer-events:auto;}
.side-menu{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:85vw;background:#fff;z-index:161;transform:translateX(-100%);transition:transform .28s ease;display:flex;flex-direction:column;}
.side-menu{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s;}
.side-menu.open{transform:none;visibility:visible;transition:transform .28s ease;}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);}
.side-links{overflow-y:auto;padding:8px 0;}
.side-links a{display:flex;justify-content:space-between;padding:14px 20px;font-size:15px;border-bottom:1px solid #f3f3f3;}
.side-links .side-title{padding:16px 20px 6px;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}

/* banner */
.hero{background:var(--banner);position:relative;overflow:hidden;}
.hero-track{display:flex;transition:transform .6s cubic-bezier(.6,.05,.3,1);}
.hero-slide{flex:0 0 100%;display:grid;grid-template-columns:1fr 1fr;min-height:480px;align-items:stretch;}
.hero-text{display:flex;flex-direction:column;justify-content:center;padding:48px 48px 48px 80px;}
.hero-eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.hero-title{font-family:var(--display);font-stretch:125%;font-weight:800;color:var(--pink);font-size:clamp(38px,5.4vw,68px);line-height:1;letter-spacing:-.015em;margin-bottom:22px;}
.hero-desc{color:var(--text);max-width:380px;margin:0 0 26px;font-size:15.5px;}
.hero-img{position:relative;background:var(--banner);}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hero-arrow{position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink);padding:10px;z-index:2;}
.hero-arrow svg{width:34px;height:20px;}
.hero-arrow.prev{left:18px;}.hero-arrow.next{right:18px;}
.hero-count{position:absolute;top:18px;right:26px;font-size:14px;color:var(--ink);z-index:2;}
.hero-dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2;}
.hero-dots span{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.18);cursor:pointer;transition:all .2s;}
.hero-dots span.on{background:var(--pink);width:22px;border-radius:4px;}

/* botoes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pink);color:#fff;border:1px solid var(--pink);padding:13px 28px;font-size:16px;font-family:inherit;cursor:pointer;border-radius:0;transition:background .15s,border-color .15s,transform .1s;}
.btn:hover{background:var(--pink-dark);border-color:var(--pink-dark);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.block{width:100%;}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--ink);}
.btn.ghost:hover{background:var(--ink);color:#fff;}
.btn.wa{background:#25D366;border-color:#25D366;}
.btn.wa:hover{background:#1fb457;border-color:#1fb457;}
.btn.sm{padding:7px 16px;font-size:14px;}
.linkbtn{background:none;border:none;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:14px;font-family:inherit;}

/* vantagens */
.perks{border-bottom:1px solid var(--line);}
.perks-row{display:grid;grid-template-columns:repeat(3,1fr);}
.perk{display:flex;gap:14px;align-items:center;padding:22px 18px;justify-content:center;}
.perk+.perk{border-left:1px solid var(--line);}
.perk svg{width:30px;height:30px;color:var(--pink);flex-shrink:0;}
.perk b{display:block;font-size:14px;color:var(--ink);}
.perk span{font-size:13px;color:var(--muted);}

/* secoes */
.section{padding:48px 0 8px;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;}
.section-head h2{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:26px;color:var(--ink);letter-spacing:-.01em;}
.section-head a,.section-head .linkbtn{font-size:14px;}
.cats{display:flex;gap:22px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;justify-content:center;}
.cats::-webkit-scrollbar{display:none;}
.cat{flex:0 0 auto;width:120px;text-align:center;cursor:pointer;}
.cat-img{width:120px;height:120px;border-radius:50%;overflow:hidden;background:var(--soft);border:2px solid transparent;transition:border-color .2s,transform .2s;margin-bottom:10px;display:flex;align-items:center;justify-content:center;color:var(--pink);font-family:var(--display);font-weight:800;font-size:30px;}
.cat-img img{width:100%;height:100%;object-fit:cover;}
.cat:hover .cat-img{border-color:var(--pink);transform:translateY(-2px);}
.cat-name{font-size:14px;color:var(--ink);}

/* carrossel e grade */
.rail-wrap{position:relative;}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 72px)/4);gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px;}
.rail::-webkit-scrollbar{display:none;}
.rail>.pcard{scroll-snap-align:start;}
.rail-arrow{position:absolute;top:36%;background:#fff;border:1px solid var(--line);width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.08);z-index:3;}
.rail-arrow.prev{left:-18px;}.rail-arrow.next{right:-18px;}
.rail-arrow svg{width:18px;height:18px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:32px 24px;}
.toolbar>*{min-width:0;max-width:100%;}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{border:1px solid var(--line);background:#fff;padding:7px 15px;font-size:13.5px;cursor:pointer;border-radius:999px;color:var(--text);transition:all .15s;}
.chip:hover{border-color:var(--ink);}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.tools-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.select{border:1px solid var(--line);padding:8px 10px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);border-radius:var(--radius);}
.toggle{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;user-select:none;}
.toggle input{accent-color:var(--pink);width:16px;height:16px;}

/* card de produto */
.pcard{display:flex;flex-direction:column;cursor:pointer;animation:fadeUp .35s ease both;min-width:0;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.pcard .imgwrap{aspect-ratio:3/4;background:var(--soft);position:relative;overflow:hidden;margin-bottom:12px;}
.pcard .imgwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s ease,transform .5s ease;}
.pcard .imgwrap img.alt{opacity:0;}
.pcard:hover .imgwrap img.alt{opacity:1;}
.pcard:hover .imgwrap img.main{transform:scale(1.03);}
.pcard .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b9b9b9;}
.pcard .noimg svg{width:56px;height:56px;}
.badge{position:absolute;top:10px;left:10px;font-size:11.5px;padding:4px 9px;letter-spacing:.03em;z-index:2;}
.badge.oos{background:#fff;color:var(--ink);border:1px solid var(--ink);}
.badge.promo{background:var(--pink);color:#fff;}
.badge.kit{background:var(--pink-dark);color:#fff;}
.kitpill{display:inline-block;margin:8px 0 2px;padding:6px 12px;border-radius:999px;background:var(--pink-soft);border:1px solid var(--pink-line);color:var(--pink-dark);font-size:13.5px;font-weight:600;}
.kitpill small{font-weight:400;color:var(--ink);opacity:.75;}
.kit-hint{font-size:13px;color:var(--pink-dark);background:var(--pink-soft);border-radius:8px;padding:8px 10px;margin:6px 0 10px;}
.sumrow.kitrow{color:#2e7d4f;}
.badge.last{background:var(--ink);color:#fff;}
.swatches{display:flex;gap:6px;margin-bottom:8px;min-height:16px;flex-wrap:wrap;}
.swatch{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}
.pcard .pname{font-size:15px;color:var(--ink);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.pcard .pprice{font-size:17px;font-weight:700;color:var(--ink);}
.pcard .pprice .from{font-size:12.5px;font-weight:400;color:var(--muted);}
.ci-price .pixline{font-size:12px;text-align:right;} .pixtotal span:last-child{color:var(--ok);} .pixline{display:block;font-size:13px;font-weight:600;color:var(--ok);margin-top:3px;} .pixoff{display:inline-block;background:var(--pink-soft);color:var(--pink-dark);font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:4px;vertical-align:middle;} .old{font-size:.8em;color:var(--muted);text-decoration:line-through;font-weight:400;margin-right:6px;}
.stockwarn{color:var(--warn);font-size:13px;margin-top:4px;}
.pcard .btn{margin-top:10px;align-self:flex-start;}

/* pagina do produto */
.crumbs{font-size:13.5px;color:var(--text);margin:20px 0 10px;}
.crumbs a{cursor:pointer;}
.crumbs a:hover{text-decoration:underline;}
.detail{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:44px;padding:16px 0 20px;}
.gallery{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:start;}
.gallery.single{grid-template-columns:1fr;}
.gallery-thumbs{display:flex;flex-direction:column;gap:10px;max-height:640px;overflow-y:auto;scrollbar-width:none;}
.gallery-thumbs img{width:76px;aspect-ratio:3/4;object-fit:cover;cursor:pointer;opacity:.55;border:1px solid transparent;transition:opacity .15s;}
.gallery-thumbs img.active,.gallery-thumbs img:hover{opacity:1;border-color:var(--ink);}
.gallery-main{aspect-ratio:3/4;background:var(--soft);position:relative;overflow:hidden;}
.gallery-main img{width:100%;height:100%;object-fit:cover;}
.gallery-main .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#bbb;}
.gal-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
.gal-arrow svg{width:18px;height:18px;}
.gal-arrow.prev{left:12px;}.gal-arrow.next{right:12px;}
.gal-count{position:absolute;bottom:12px;right:12px;background:rgba(255,255,255,.9);font-size:12px;padding:3px 9px;border-radius:10px;}
.info-col{position:sticky;top:140px;align-self:start;}
.p-title{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(24px,2.6vw,32px);line-height:1.12;color:var(--ink);margin-bottom:12px;letter-spacing:-.01em;}
.p-price{font-size:32px;color:var(--ink);margin-bottom:4px;}
.p-sub{font-size:13.5px;color:var(--muted);margin-bottom:20px;}
.optlabel{font-size:15px;margin:18px 0 8px;color:var(--ink);}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.opt{min-width:46px;padding:9px 14px;border:1px solid #cfcfcf;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--radius);transition:all .12s;}
.opt:hover{border-color:var(--ink);}
.opt.selected{border-color:var(--ink);background:#EDEDED;box-shadow:inset 0 0 0 1px var(--ink);}
.opt.off{color:#b0b0b0;border-style:dashed;text-decoration:line-through;}
.opt .swatch{width:14px;height:14px;}
.p-stock{font-size:17px;margin:20px 0 4px;color:var(--danger);}
.p-stock.warn{color:var(--warn);}
.buyrow{display:flex;gap:12px;margin-top:18px;}
.qty{display:flex;align-items:center;border:1px solid #cfcfcf;height:50px;}
.qty button{width:40px;height:100%;background:none;border:none;cursor:pointer;font-size:20px;color:var(--ink);}
.qty input{width:34px;border:none;text-align:center;font-size:16px;font-family:inherit;}
.buyrow .btn{flex:1;height:50px;font-size:17px;}
.p-actions2{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.p-actions2 .btn{flex:1;min-width:150px;}
.ship{margin-top:24px;border-top:1px solid var(--line);padding-top:20px;}
.ship-title{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--ink);margin-bottom:10px;}
.ship-title svg{width:22px;height:22px;}
.cepform{display:flex;gap:8px;}
.cepform input{flex:1;border:1px solid #cfcfcf;padding:11px 12px;font-size:15px;font-family:inherit;border-radius:var(--radius);min-width:0;}
.cepform input:focus{outline:none;border-color:var(--pink);}
.cepform .btn{padding:10px 18px;font-size:15px;}
.ship-out{margin-top:12px;font-size:14px;}
.ship-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);padding:13px 16px;margin-top:8px;border:1px solid transparent;border-radius:var(--radius);}
label.ship-opt{cursor:pointer;}
label.ship-opt:has(input:checked){border-color:var(--ink);background:#fff;}
.ship-opt input{accent-color:var(--pink);margin-right:8px;}
.ship-opt .sname{color:var(--ink);font-size:14px;}
.ship-opt .sdays{color:var(--muted);font-size:13px;}
.ship-opt .sprice{font-weight:600;color:var(--ink);white-space:nowrap;}
.ship-note{font-size:13px;color:var(--muted);margin-top:8px;}
.ship-err{color:var(--danger);font-size:13.5px;}
.acc{border-top:1px solid var(--line);}
.acc:last-child{border-bottom:1px solid var(--line);}
.acc summary{list-style:none;cursor:pointer;padding:16px 0;display:flex;justify-content:space-between;font-family:var(--display);font-stretch:125%;font-weight:700;color:var(--ink);font-size:16px;}
.acc summary::-webkit-details-marker{display:none;}
.acc summary:after{content:"+";font-weight:400;font-size:20px;line-height:1;}
.acc[open] summary:after{content:"–";}
.acc .acc-body{padding:0 0 18px;font-size:14.5px;color:var(--text);}
.acc-wrap{margin-top:24px;}

/* sacola */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:150;}
.cart-overlay.open{opacity:1;pointer-events:auto;}
.cart-drawer{position:fixed;top:0;right:0;width:420px;max-width:100vw;height:100%;background:#fff;transform:translateX(100%);transition:transform .3s ease;z-index:151;display:flex;flex-direction:column;}
.cart-drawer{visibility:hidden;transition:transform .3s ease,visibility 0s linear .3s;}
.cart-drawer.open{transform:none;visibility:visible;transition:transform .3s ease;}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);}
.drawer-head h3{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:19px;color:var(--ink);}
.xbtn{background:none;border:none;cursor:pointer;font-size:28px;line-height:1;color:var(--ink);padding:0 4px;}
.cart-items{flex:1;overflow-y:auto;padding:4px 20px;}
.cart-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);}
.ci-img{width:74px;aspect-ratio:3/4;object-fit:cover;background:var(--soft);flex-shrink:0;}
.ci-info{flex:1;min-width:0;}
.ci-top{display:flex;justify-content:space-between;gap:8px;}
.ci-name{font-size:14.5px;color:var(--ink);}
.ci-variation{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px;}
.ci-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.ci-qty{display:flex;align-items:center;border:1px solid #d6d6d6;height:32px;}
.ci-qty button{width:30px;height:100%;background:none;border:none;cursor:pointer;font-size:16px;}
.ci-qty span{min-width:24px;text-align:center;font-size:14px;}

/* ---------- CATALOG DISPLAY MERGE GROUPS ---------- */
/* Agrupa visualmente produtos diferentes em um so card/pagina no catalogo,
   sem alterar nada no Korpa Gestao nem nos produtos reais no banco/estoque. */
var MERGE_GROUPS = [
{ key:"corta-vento", displayName:"Casaco Corta Vento", matchNames:["Casaquinho Corta Vento","Casaco Corta Vento"] }
];

function buildMergedProduct(g, members, gi){
var images = [];
members.forEach(function(m){ (m.images||[]).forEach(function(img){ if(img && images.indexOf(img)===-1) images.push(img); }); });
var colorImages = [];
members.forEach(function(m){ (m.color_images||[]).forEach(function(ci){ colorImages.push(ci); }); });
var variations = [];
members.forEach(function(m){
(m.variations||[]).forEach(function(v){
var clone = {};
for(var k in v){ clone[k]=v[k]; }
clone._realProductId = m.id;
variations.push(clone);
});
});
var prices = variations.map(function(v){ return v.price!=null ? Number(v.price) : null; }).filter(function(n){ return n!=null; });
var priceMin = prices.length ? Math.min.apply(null,prices) : null;
var priceMax = prices.length ? Math.max.apply(null,prices) : null;
var anyInStock = members.some(function(m){ return m.in_stock; });
var descs = members.map(function(m){ return m.description; }).filter(Boolean);
var specsArr = members.map(function(m){ return m.specs; }).filter(Boolean);
return {
id: "merge__"+gi,
name: g.displayName,
category: members[0].category,
brand: members[0].brand,
images: images,
color_images: colorImages,
variations: variations,
in_stock: anyInStock,
promo_price: null,
price: (priceMin!=null ? priceMin : members[0].price),
price_min: priceMin,
price_max: priceMax,
description: descs.length ? descs.join("\n\n") : null,
specs: specsArr.length ? specsArr.join("\n\n") : null,
featured: members.some(function(m){ return m.featured; }),
_merged: true,
_members: members.map(function(m){ return m.id; })
};
}

function buildDisplayProducts(){
var used = {};
var result = [];
MERGE_GROUPS.forEach(function(g, gi){
var members = products.filter(function(p){ return g.matchNames.indexOf(p.name) > -1; });
if(members.length === 0) return;
members.forEach(function(m){ used[m.id] = true; });
if(members.length === 1){ result.push(members[0]); return; }
result.push(buildMergedProduct(g, members, gi));
});
products.forEach(function(p){ if(!used[p.id]) result.push(p); });
return result;
}

function findProductForRoute(id){
var list = buildDisplayProducts();
return list.find(function(x){ return x.id===id; }) || null;
}

  if(res.error){
    document.getElementById("app").innerHTML = "<div class=\"wrap\"><p>Não foi possível carregar a loja agora. Tente novamente em instantes.</p></div>";
    console.error(res.error);
    return;
  }
  products = res.data || [];
  var wasLoaded = loaded, keepY = window.scrollY;
  loaded = true;
  route(wasLoaded);
  if(wasLoaded) window.scrollTo(0, keepY);
}

/* ---------- ROUTING (hash based, static hosting friendly) ---------- */

function route(isRefresh){
  var hash = window.location.hash || "#home";
  if(hash.indexOf("#produto/") === 0){
    renderProductPage(hash.replace("#produto/",""));
  } else if(hash.indexOf("#pagina/") === 0){
    renderPagina(decodeURIComponent(hash.replace("#pagina/","")));
  } else if(hash.indexOf("#categoria/") === 0){
    renderHome(decodeURIComponent(hash.replace("#categoria/","")));
  } else if(hash === "#promocao"){
    renderPromoPage();
  } else {
    renderHome(null);
  }
  renderCartBadge();
  try{ tickCountdowns(); }catch(e){}
  if(!isRefresh) window.scrollTo(0,0);
  try{ registrarVisita(); }catch(e){}
}

/* ---------- HELPERS DE PRODUTO ---------- */
function visibleProducts(list){ return list; }
function cardFeePct(){ return (typeof CARD_FEE_PCT==="number") ? CARD_FEE_PCT : 10; }
function cardPrice(n){ return Math.round(Number(n)*(1+cardFeePct()/100)*100)/100; }
function pixOffPct(){ return Math.round(100*(1-1/(1+cardFeePct()/100))); }
function pixLine(n){ return "<span class=\"pixline\">"+brl(n)+" no Pix <span class=\"pixoff\">"+pixOffPct()+"% OFF</span></span>"; }
/* Preco em destaque = preco no cartao; preco do sistema = preco no Pix (com selo de desconto) */
function priceHtmlFor(p, v){
  if(p.promo_price){ var cheio = precoCheio(p, v); return (cheio > Number(p.promo_price) ? "<span class=\"old\">"+brl(cardPrice(cheio))+"</span>" : "")+brl(cardPrice(p.promo_price))+pixLine(p.promo_price); }
  if(v && v.price!=null){ return brl(cardPrice(v.price))+pixLine(v.price); }
  if(p.price_min!=null && p.price_max!=null && Number(p.price_min)!==Number(p.price_max)){ return "<span class=\"from\">a partir de </span>"+brl(cardPrice(p.price_min))+pixLine(p.price_min); }
  if(p.price_min!=null){ return brl(cardPrice(p.price_min))+pixLine(p.price_min); }
  return brl(cardPrice(p.price))+pixLine(p.price);
}
function productStock(p){
  if(!p.variations || !p.variations.length) return (typeof p.stock==="number") ? p.stock : null;
  var known = false, total = 0;
  p.variations.forEach(function(v){ if(typeof v.stock==="number"){ known = true; if(v.available!==false) total += Math.max(0, v.stock); } });
  return known ? total : null;
}
function stockWarnText(n){
  return ""; /* aviso de ultimas pecas desativado */

  return "";

function optKey(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim(); }
function optLabel(p, field, key){
  var v = (p.variations||[]).find(function(x){ return optKey(x[field])===key && /[\u00c0-\u00ff]/.test(x[field]||"") && !/^\u00d9/.test(x[field]||""); }) ||
          (p.variations||[]).find(function(x){ return optKey(x[field])===key; });
  return v ? v[field] : key;
}
function productColors(p, onlyAvailable){
  var seen = [], out = [];
  (p.variations||[]).forEach(function(v){
    if(!v.color) return;
    if(onlyAvailable && v.available===false) return;
    var k = optKey(v.color);
    if(seen.indexOf(k)===-1){ seen.push(k); out.push(optLabel(p,"color",k)); }
  });
  return out;
}
function productSizes(p){
  var seen = [], out = [];
  (p.variations||[]).forEach(function(v){ var k = optKey(v.size); if(k && seen.indexOf(k)===-1){ seen.push(k); out.push(optLabel(p,"size",k)); } });
  return out.sort(function(a,b){
    var ia = SIZE_ORDER.indexOf(optKey(a).toUpperCase()), ib = SIZE_ORDER.indexOf(optKey(b).toUpperCase());
    if(ia===-1 && ib===-1) return String(a).localeCompare(String(b),"pt-BR",{numeric:true});
    if(ia===-1) return 1; if(ib===-1) return -1; return ia-ib;
  });
}
function effectivePrice(p){
  if(p.promo_price) return Number(p.promo_price);
  if(p.price_min!=null) return Number(p.price_min);
  return Number(p.price||0);
}
/* ---------- PROMOCAO "LEVE N POR R$ X" (kits da tabela catalog_promo_kits, via catalog_products.promo_kit) ---------- */
// Regra "Leve N por R$ X" (out/2026). MESMA logica no site (index.html) e no
// criar-pedido (kit.ts) - manter as duas copias iguais.
// lines: [{productId, qty, price, ...}]  kits: [{id, nome, qtd, preco, product_ids:[...]}]
// Junta as unidades de cada kit, da mais cara pra mais barata; a cada "qtd"
// unidades o grupo sai por "preco" (rateado entre as pecas). Sobra fica no preco normal.
function aplicarKits(lines, kits){
  var r2 = function(n){ return Math.round(n*100)/100; };
  var kitDe = {};
  (kits||[]).forEach(function(k){ (k.product_ids||[]).forEach(function(pid){ if(!kitDe[pid]) kitDe[pid] = k; }); });
  var unidades = {}; // kitId -> [{li, price}]
  lines.forEach(function(l, li){
    var k = kitDe[l.productId]; if(!k) return;
    for(var u=0; u<l.qty; u++){ (unidades[k.id] = unidades[k.id] || []).push({ li: li, price: Number(l.price)||0, novo: null, kit: k }); }
  });
  var desconto = 0, bruto = 0, grupos = [];
  Object.keys(unidades).forEach(function(kid){
    var us = unidades[kid].slice().sort(function(a,b){ return (b.price-a.price) || (a.li-b.li); });
    var k = us[0].kit, qtd = Math.max(2, Number(k.qtd)||2), preco = Number(k.preco)||0;
    for(var g=0; g+qtd<=us.length; g+=qtd){
      var grp = us.slice(g, g+qtd);
      var soma = r2(grp.reduce(function(s,x){ return s+x.price; }, 0));
      if(!(preco > 0) || soma <= preco) continue;
      var acum = 0;
      grp.forEach(function(x, j){
        if(j < grp.length-1){ x.novo = r2(x.price * preco / soma); acum = r2(acum + x.novo); }
        else x.novo = r2(preco - acum);
      });
      bruto = r2(bruto + soma); desconto = r2(desconto + soma - preco);
      grupos.push({ kitId: k.id, nome: k.nome, pecas: qtd, preco: preco, de: soma });
    }
  });
  var novas = [];
  lines.forEach(function(l, li){
    var todas = [];
    Object.keys(unidades).forEach(function(kid){ unidades[kid].forEach(function(x){ if(x.li===li) todas.push(x); }); });
    var porPreco = {}, normal = l.qty, kitId = null;
    todas.forEach(function(x){ if(x.novo!=null){ normal--; kitId = x.kit.id; porPreco[x.novo] = (porPreco[x.novo]||0) + 1; } });
    if(normal > 0){ var a = Object.assign({}, l); a.qty = normal; novas.push(a); }
    Object.keys(porPreco).forEach(function(p){ var b = Object.assign({}, l); b.qty = porPreco[p]; b.price = Number(p); b.promoKit = kitId; b.precoOriginal = Number(l.price); novas.push(b); });
  });
  return { lines: novas, desconto: desconto, bruto: bruto, grupos: grupos };
}

function kitsAtivos(){
  var porId = {};
  products.forEach(function(p){
    var k = p.promo_kit; if(!k || !k.id) return;
    if(!porId[k.id]) porId[k.id] = { id:k.id, nome:k.nome, qtd:Number(k.qtd)||2, preco:Number(k.preco)||0, product_ids:[] };
    porId[k.id].product_ids.push(p.id);
  });
  return Object.keys(porId).map(function(id){ return porId[id]; });
}
function productKit(p){
  if(p.promo_kit) return p.promo_kit;
  if(p._members){ var m = products.find(function(x){ return p._members.indexOf(x.id)>-1 && x.promo_kit; }); if(m) return m.promo_kit; }
  return null;
}
function kitTexto(k){ return "Leve "+k.qtd+" por "+brl(k.preco).replace(",00",""); }
function cartKit(){
  var kits = kitsAtivos();
  if(!kits.length || !cart.length) return { desconto:0, bruto:0, grupos:[], falta:null };
  var r = aplicarKits(cart.map(function(i){ return { productId:i.id, qty:i.qty, price:Number(i.unitPrice)||0 }; }), kits);
  var falta = null;
  kits.forEach(function(k){
    var n = cart.filter(function(i){ return k.product_ids.indexOf(i.id)>-1; }).reduce(function(s,i){ return s+i.qty; }, 0);
    if(n % k.qtd !== 0 && !falta) falta = { kit:k, faltam: k.qtd - (n % k.qtd) };
  });
  r.falta = falta;
  return r;
}
function kitResumoTexto(r){
  var nomes = []; r.grupos.forEach(function(g){ if(nomes.indexOf(g.nome)===-1) nomes.push(g.nome); });
  return "Promoção " + nomes.join(", ");
}

function sortList(list){
  var l = list.slice();
  if(homeOnlyAvail) l = l.filter(function(p){ return p.in_stock; });
  if(homeSort==="low") l.sort(function(a,b){ return effectivePrice(a)-effectivePrice(b); });
  else if(homeSort==="high") l.sort(function(a,b){ return effectivePrice(b)-effectivePrice(a); });
  else if(homeSort==="az") l.sort(function(a,b){ return String(a.name).localeCompare(String(b.name),"pt-BR"); });
  else l.sort(function(a,b){ return (b.in_stock?1:0)-(a.in_stock?1:0); });
  return l;
}
function setSort(v){ homeSort = v; rerenderCurrentList(); }
function setOnlyAvail(v){ homeOnlyAvail = v; rerenderCurrentList(); }

function heroSlides(list){
  var slides = [];
  var featured = list.filter(function(p){ return p.featured && p.in_stock && p.images && p.images[0]; });
  featured.slice(0,2).forEach(function(p){
    slides.push({title:p.name, eyebrow:"Destaque", desc:"Peça queridinha da KORPA, pronta pra entrega.", img:p.images[0], href:routeId(p)});
  });
  allCategories().forEach(function(c){
    if(slides.length>=4) return;
    var p = list.find(function(x){ return inCategory(x,c) && x.in_stock && x.images && x.images[0]; });
    if(p) slides.push({title:c, eyebrow:"Coleção", desc:"Conforto e caimento pra treinar e pro dia a dia.", img:p.images[0], href:"#categoria/"+encodeURIComponent(c)});
  });
  return slides;
}
function heroHtml(slides){
  if(!slides.length) return "";
  if(heroIndex >= slides.length) heroIndex = 0;
  return "<section class=\"hero\" id=\"hero\">" +
    "<div class=\"hero-track\" id=\"hero-track\" style=\"transform:translateX(-"+(heroIndex*100)+"%)\">" +
    slides.map(function(s){
      return "<div class=\"hero-slide\">" +
        "<div class=\"hero-text\"><div class=\"hero-eyebrow\">"+esc(s.eyebrow)+"</div>" +
        "<h2 class=\"hero-title\">"+esc(s.title)+"</h2><p class=\"hero-desc\">"+esc(s.desc)+"</p>" +
        "<div><a class=\"btn\" href=\""+esc(s.href)+"\">Comprar agora</a></div></div>" +
        "<div class=\"hero-img\"><img src=\""+esc(s.img)+"\" alt=\""+esc(s.title)+"\"></div>" +
      "</div>";
    }).join("") + "</div>" +
    (slides.length>1 ? (
      "<span class=\"hero-count\" id=\"hero-count\">"+(heroIndex+1)+" / "+slides.length+"</span>" +
      "<button class=\"hero-arrow prev\" aria-label=\"Anterior\" onclick=\"heroGo(-1,true)\">"+ICON.arrowL+"</button>" +
      "<button class=\"hero-arrow next\" aria-label=\"Próximo\" onclick=\"heroGo(1,true)\">"+ICON.arrowR+"</button>" +
      "<div class=\"hero-dots\" id=\"hero-dots\">"+slides.map(function(_,i){ return "<span class=\""+(i===heroIndex?"on":"")+"\" onclick=\"heroTo("+i+",true)\"></span>"; }).join("")+"</div>"
    ) : "") +
  "</section>";
}
function heroTo(i, manual){
  var track = document.getElementById("hero-track");
  if(!track) return;
  var n = track.children.length;
  heroIndex = (i + n) % n;
  track.style.transform = "translateX(-"+(heroIndex*100)+"%)";
  var c = document.getElementById("hero-count"); if(c) c.textContent = (heroIndex+1)+" / "+n;
  var d = document.getElementById("hero-dots"); if(d) [].forEach.call(d.children, function(el,k){ el.classList.toggle("on", k===heroIndex); });
  if(manual) startHeroTimer();
}
function heroGo(d, manual){ heroTo(heroIndex + d, manual); }
function startHeroTimer(){
  clearInterval(heroTimer);
  heroTimer = setInterval(function(){ if(document.getElementById("hero-track")) heroGo(1,false); else clearInterval(heroTimer); }, 6000);
}
function enableHeroSwipe(){
  var el = document.getElementById("hero");
  if(!el) return;
  var x0 = null;
  el.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  el.addEventListener("touchend", function(e){ if(x0==null) return; var dx = e.changedTouches[0].clientX - x0; if(Math.abs(dx)>40) heroGo(dx<0?1:-1,true); x0 = null; });
}

function normSearch(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim(); }

/* Busca pelo codigo do produto (out/2026). O codigo (ex.: KP-0041) NAO aparece no site,
   so serve pra cliente achar a peca: "0041", "41", "kp0041" ou "KP-0041" encontram a mesma.
   Compara o numero exato (41 nao acha a 0410). Produto agrupado vale o codigo de qualquer membro. */
function numeroCodigo(s){
  var m = String(s||"").toLowerCase().replace(/\s+/g,"").match(/^(?:kp)?-?0*(\d+)$/);
  return m ? m[1] : null;
}
function buscaPorCodigo(p, termo){
  var alvo = numeroCodigo(termo); if(!alvo) return false;
  var codigos = [p.code];
  if(p._members) p._members.forEach(function(mid){ var m = products.find(function(x){ return x.id===mid; }); if(m) codigos.push(m.code); });
  return codigos.some(function(c){ return c && numeroCodigo(c) === alvo; });
}

function colorNameToHex(name){
  if(!name) return null;
  var n = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  var map = [
    [["doce de leite"], "#c99a68"],
    [["azul bebe","azul bb"], "#9fd2ef"],
    [["pink"], "#e3408e"],
    [["castanho"], "#7a4b2f"],
    [["turquesa"], "#1aa3a3"],
    [["petroleo"], "#0f5a64"],
    [["marinho"], "#1b2a4a"],
    [["preto","black"], "#111111"],
    [["off white","offwhite","branco"], "#f5f5f2"],
    [["cinza","grafite","chumbo"], "#8a8a8a"],
    [["azul"], "#2f5aa8"],
    [["vinho","bordo","vermelho"], "#8b2635"],
    [["verde"], "#2f6e46"],
    [["amarelo"], "#e0c341"],
    [["rosa","pink"], "#e2879e"],
    [["roxo","lilas","lavanda"], "#7a5aa8"],
    [["laranja"], "#d97b34"],
    [["bege"], "#d8c3a0"],
    [["marrom","caramelo","chocolate"], "#6b4a34"],
    [["nude"], "#dcb28c"],
    [["dourado","ouro"], "#c9a227"],
    [["prata","prateado"], "#b8bcc2"],
    [["caqui","khaki"], "#a89f6b"],
    [["jeans","denim"], "#4c6b8a"]
  ];
  for(var i=0;i<map.length;i++){
    for(var k=0;k<map[i][0].length;k++){
      if(n.indexOf(map[i][0][k])>-1) return map[i][1];
    }
  }
  return null;
}

function getSelectedStockLimit(){
  var p = currentProduct();
  if(!p) return 99;
  if(p.variations && p.variations.length){
    var v = (selectedVariationIdx!=null) ? p.variations[selectedVariationIdx] : null;
    if(v && typeof v.stock === "number") return Math.max(1, v.stock);
    return 99;
  }
  if(typeof p.stock === "number") return Math.max(1, p.stock);
  return 99;
}
function getItemStockLimit(item){
  var p = products.find(function(x){ return x.id===item.id; });
  if(!p) return null;
  if(p.variations && p.variations.length && item.variation){
    var match = p.variations.find(function(v){ return ((v.size||"") + (v.color?(" / "+v.color):"")) === item.variation; });
    return (match && typeof match.stock === "number") ? match.stock : null;
  }
  if(typeof p.stock === "number") return p.stock;
  return null;
}

/* ---------- ESCOLHA DE TAMANHO E COR (separados) ---------- */
function hasColors(p){ return (p.variations||[]).some(function(v){ return !!v.color; }); }
function hasSizes(p){ return (p.variations||[]).some(function(v){ return !!v.size; }); }
function variationMatches(v, size, color){
  return (size==null || optKey(v.size)===optKey(size)) && (color==null || optKey(v.color)===optKey(color));
}
function optAvailable(p, size, color){
  return (p.variations||[]).some(function(v){ return v.available!==false && variationMatches(v,size,color); });
}
function findVarIdx(p){
  var needSize = hasSizes(p), needColor = hasColors(p);
  if((needSize && selSize==null) || (needColor && selColor==null)) return null;
  var idx = -1;
  (p.variations||[]).forEach(function(v,i){
    if(idx>-1) return;
    if(v.available===false) return;
    if((!needSize || optKey(v.size)===optKey(selSize)) && (!needColor || optKey(v.color)===optKey(selColor))) idx = i;
  });
  if(idx===-1){
    (p.variations||[]).forEach(function(v,i){
      if(idx>-1) return;
      if((!needSize || optKey(v.size)===optKey(selSize)) && (!needColor || optKey(v.color)===optKey(selColor))) idx = i;
    });
  }
  return idx>-1 ? idx : null;
}
function pickersHtml(p){
  if(!p.variations || !p.variations.length) return "";
  var html = "";
  var sizes = productSizes(p);
  if(sizes.length){
    html += "<div class=\"optlabel\">Tamanho: <b>"+(selSize!=null?esc(selSize):"")+"</b></div><div class=\"opts\">" +
      sizes.map(function(s){
        var ok = optAvailable(p, s, selColor);
        return "<button class=\"opt"+(selSize!=null&&optKey(selSize)===optKey(s)?" selected":"")+(ok?"":" off")+"\" onclick=\"pickSize('"+esc(s).replace(/'/g,"\\'")+"')\">"+esc(s)+"</button>";
      }).join("") + "</div>";
  }
  var colors = productColors(p, false);
  if(colors.length){
    html += "<div class=\"optlabel\">"+(encEscolha(p).indexOf("frase") > -1 ? "Cor e frase" : "Cor")+": <b>"+(selColor!=null?esc(selColor):"")+"</b></div><div class=\"opts\">" +
      colors.map(function(c){
        var ok = optAvailable(p, selSize, c);
        return "<button class=\"opt"+(selColor!=null&&optKey(selColor)===optKey(c)?" selected":"")+(ok?"":" off")+"\" onclick=\"pickColor('"+esc(c).replace(/'/g,"\\'")+"')\">"+swatchHtml(c)+esc(c)+"</button>";
      }).join("") + "</div>";
  }
  return html;
}
function pickSize(s){
  var p = currentProduct(); if(!p) return;
  selSize = (selSize!=null && optKey(selSize)===optKey(s)) ? null : s;
  // se a cor escolhida nao existe nesse tamanho, tenta manter so se existir
  if(selSize!=null && selColor!=null && !(p.variations||[]).some(function(v){ return variationMatches(v,selSize,selColor); })) selColor = null;
  if(selSize!=null && selColor==null){
    var cs = productColors(p,false).filter(function(c){ return optAvailable(p, selSize, c); });
    if(cs.length===1) selColor = cs[0];
  }
  refreshVariationUI(p);
}
function pickColor(c){
  var p = currentProduct(); if(!p) return;
  selColor = (selColor!=null && optKey(selColor)===optKey(c)) ? null : c;
  if(selColor!=null && selSize!=null && !(p.variations||[]).some(function(v){ return variationMatches(v,selSize,selColor); })) selSize = null;
  if(selColor!=null) applyColorImage(p, selColor);
  refreshVariationUI(p);
}
function autoSelectSingle(p){

function addToCart(productId){
  var _pa = findProductForRoute(productId); if(_pa && _pa.sob_encomenda) return;
  var p = findProductForRoute(productId);
  if(!p) return;
  if(!p.in_stock){ showToast("Produto sem estoque no momento."); return; }
  var variation = null;
  var colorRaw = null;
  var v = null;
  var stockLimit = null;
  if(p.variations && p.variations.length){
    if(selectedVariationIdx===null || selectedVariationIdx===undefined){ showToast("Selecione um tamanho/cor antes de adicionar."); return; }
    v = p.variations[selectedVariationIdx];
    if(!v || !v.available){ showToast("Essa opção está indisponível."); return; }
    variation = (v.size||"") + (v.color ? (" / "+v.color) : "");
    colorRaw = v.color || null;
var realProductId = v._realProductId || p.id;
    stockLimit = (typeof v.stock === "number") ? v.stock : null;
  } else if(typeof p.stock === "number"){
    stockLimit = p.stock;
  }
  var qtyEl = document.getElementById("qty-input");
  var qty = qtyEl ? (parseInt(qtyEl.value,10)||1) : 1;
  var idForCart = (typeof realProductId !== "undefined" && realProductId) ? realProductId : p.id;
var key = idForCart + "|" + (variation||"");
  var existing = cart.find(function(c){ return c.key===key; });
  var already = existing ? existing.qty : 0;
  var msg = "Produto adicionado ao carrinho!";
  if(stockLimit!=null){
    if(already >= stockLimit){ showToast("Você já tem no carrinho a quantidade máxima disponível em estoque."); return; }
    if((already+qty) > stockLimit){ qty = stockLimit - already; msg = "Quantidade limitada ao estoque disponível ("+stockLimit+")."; }
  }
  if(existing){ existing.qty += qty; } else {
    cart.push({ key:key, id:idForCart, name:p.name, unitPrice:(p.promo_price || (v && v.price!=null ? v.price : p.price)), variation:variation, variationId:(v?v.id:null), color:colorRaw, image:(p.images&&p.images[0])||null, qty:qty });
  }
  saveCart();
  renderCartBadge(true);
  showToast(msg);
}

function updateCartQty(idx, delta){
  if(!cart[idx]) return;
  if(delta>0){
    var limit = getItemStockLimit(cart[idx]);
    if(limit!=null && cart[idx].qty >= limit){
      showToast("Quantidade máxima em estoque atingida.");
      return;
    }
  }
  cart[idx].qty += delta;
  if(cart[idx].qty<=0) cart.splice(idx,1);
  saveCart();
  renderCartItems();
  renderCartBadge();
}
function removeCartItem(idx){
  cart.splice(idx,1);
  saveCart();
  renderCartItems();
  renderCartBadge();
}

function renderCartBadge(bump){

function submitPixPayment(){
  var name = document.getElementById("pix-name").value.trim();
  var email = document.getElementById("pix-email").value.trim();
  var cpf = document.getElementById("pix-cpf").value.trim();
  var phone = document.getElementById("pix-phone").value.replace(/\D/g,"");

  var cep = document.getElementById("pix-cep").value.replace(/\D/g,"");

  if(!validaCPF(cpf)){ errEl.textContent = "Informe um CPF valido (11 digitos)."; return; }
  if(!phone || phone.length<10){ errEl.textContent = "Informe um WhatsApp valido, com DDD."; return; }
  if(!address){ errEl.textContent = "Informe seu endereco."; return; }
  if(!currentFreight || currentFreight.cep!==cep){ errEl.textContent = "Calcule o frete para esse CEP antes de gerar o Pix."; return; }

  var items = cart.map(function(it){
    var vid = it.variationId || null;
    if(it.variation){
      var prod = products.find(function(x){ return x.id===it.id; });
      if(prod && prod.variations){
        var match = prod.variations.find(function(v){ return ((v.size||"") + (v.color?(" / "+v.color):"")) === it.variation; });
        if(match) vid = match.id;
      }
    }
    return { productId: it.id, variationId: vid, qty: it.qty };
  });

  var btn = document.querySelector("#pix-step-form .actionbtn.pix");
  if(btn){ btn.disabled = true; btn.textContent = "Gerando..."; }

  sb.functions.invoke("criar-pedido", { body: {

  }}).then(function(res){
    if(btn){ btn.disabled = false; btn.textContent = "Pagar com Pix"; }
    if(res.error){
      var msg = res.error.message || "Nao foi possivel gerar o pagamento. Tente novamente.";
      if(res.error.context && typeof res.error.context.json === "function"){
        res.error.context.json().then(function(body){
          errEl.textContent = (body && body.error) || msg;
        }).catch(function(){ errEl.textContent = msg; });
      } else {
        errEl.textContent = msg;
      }
      return;
    }
    var data = res.data;
    if(!data || data.error){
      errEl.textContent = (data && data.error) || "Nao foi possivel gerar o pagamento. Tente novamente.";

    startPixPolling();
  }).catch(function(){
    if(btn){ btn.disabled = false; btn.textContent = "Pagar com Pix"; }
    errEl.textContent = "Erro de conexao. Tente novamente.";
  });
}
  function startPixPolling(){
  stopPixPolling();
  var attempts = 0;
  pixPollTimer = setInterval(function(){
    attempts++;

    sb.functions.invoke("pedido-status", { body: { pedidoId: currentPedidoId } }).then(function(res){
      var status = res.data ? res.data.status : null;
      if(status === "pago"){
        stopPixPolling();
                  document.getElementById("pix-qr-wrap").style.display = "none";
                  document.getElementById("pix-copy-text").style.display = "none";

      }
    }).catch(function(){});

/* ---------- CALCULO DE FRETE (servidor: calcular-frete) ---------- */
async function cotarFreteZonas(cep){
  var vc = await fetch("https://viacep.com.br/ws/"+cep+"/json/").then(function(r){ return r.json(); });
  if(vc.erro) return {erro:"CEP não encontrado.", opcoes:[]};
  var zonesRes = await sb.from("catalog_freight_zones").select("*");
  var zone = (zonesRes.data||[]).find(function(z){ return (z.ufs||[]).indexOf(vc.uf) > -1 && normSearch(z.name) === normSearch(vc.localidade); });
  return { uf:vc.uf, cidade:vc.localidade, opcoes: zone ? [{tipo:"local", servicoId:"local", nome:"Entrega KORPA - "+zone.name, preco:Number(zone.price)||0, prazoDias:null}] : [] };
}
async function cotarFrete(cep, items){
  try{
    var res = await sb.functions.invoke("calcular-frete", { body: { cep: cep, items: items } });
    if(res.error) throw res.error;
    var d = res.data || {};
    if(d.error) return {erro:d.error, opcoes:[]};
    if(d.erro && /cep/i.test(d.erro) && !(d.opcoes||[]).length && !d.cidade) return {erro:d.erro, opcoes:[]};
    return {uf:d.uf||"", cidade:d.cidade||"", opcoes:d.opcoes||[]};
  }catch(e){
    try{ return await cotarFreteZonas(cep); }catch(e2){ return {erro:"Não foi possível calcular o frete agora. Tente de novo em instantes.", opcoes:[]}; }
  }
}
function cartFreightItems(){ return cart.map(function(i){ return {productId:i.id, qty:i.qty}; }); }

async function calcFreteCarrinho(silent){
  var input = document.getElementById("cart-cep");
  var cep = (input && input.value) ? input.value.replace(/\D/g,"") : cartFreight.cep;
  if(cep.length!==8){ if(!silent){ cartFreight.erro = "Digite um CEP válido (8 números)."; cartFreight.cep = ""; renderCartTotals(); } return; }
  cartFreight.combinarSemCep = false;
  cartFreight.cep = cep; cartFreight.loading = true; cartFreight.erro = null; cartFreight.sig = cartSignature();
  saveCep(cep);
  renderCartTotals();
  var r = await cotarFrete(cep, cartFreightItems());
  cartFreight.loading = false;
  cartFreight.erro = r.erro || null;
  cartFreight.uf = r.uf||""; cartFreight.cidade = r.cidade||"";
  cartFreight.opcoes = r.opcoes||[]; cartFreight.sel = 0;
  renderCartTotals();
}
function combinarEntrega(){
  cartFreight.combinarSemCep = true; cartFreight.erro = null;
  renderCartTotals();
}

async function calcFreteProduto(silent){
  var p = currentProduct(); if(!p) return;
  var input = document.getElementById("pdp-cep");
  var out = document.getElementById("pdp-ship-out");
  var cep = input ? input.value.replace(/\D/g,"") : "";
  if(cep.length!==8){ if(!silent && out) out.innerHTML = "<div class=\"ship-err\">Digite um CEP válido (8 números).</div>"; return; }
  saveCep(cep);
  if(out) out.innerHTML = "<div class=\"ship-note\">Calculando frete...</div>";
  var realId = p.id;
  if(selectedVariationIdx!=null && p.variations[selectedVariationIdx] && p.variations[selectedVariationIdx]._realProductId) realId = p.variations[selectedVariationIdx]._realProductId;
  else if(p._members && p._members.length) realId = p._members[0];
  var qtyEl = document.getElementById("qty-input");
  var r = await cotarFrete(cep, [{productId:realId, qty:qtyEl ? (parseInt(qtyEl.value,10)||1) : 1}]);
  var state = {cep:cep, uf:r.uf||"", cidade:r.cidade||"", opcoes:r.opcoes||[], sel:0, erro:r.erro||null, loading:false};
  if(out && currentProduct() && currentProduct().id===p.id) out.innerHTML = freightOptionsHtml(state, null);
  if(!cartFreight.cep && !cartFreight.combinarSemCep){ var ci = document.getElementById("cart-cep"); if(ci) ci.value = formatCep(cep); cartFreight.cep = cep; cartFreight.sig = ""; }
}

/* ---------- FORMA DE PAGAMENTO: Pix no site / Cartao (+10%) pelo WhatsApp ---------- */
var CARD_FEE_PCT = 10;
var payMethod = "pix";
function pixPermitido(){ return !!(currentFreight && !currentFreight.combinarDireto && currentFreight.servicoId && currentFreight.cep); }
function round2(n){ return Math.round(n*100)/100; }
function checkoutTotals(){
  var kr = cartKit();
  var sub = round2(cartTotal() - kr.desconto);
  var foraDoKit = round2(cartTotal() - kr.bruto);
  var fr = (currentFreight && !currentFreight.combinarDireto) ? Number(currentFreight.value)||0 : 0;
  var descPix = cupomDescontoSite(foraDoKit, sub);
  var desc = payMethod==="pix" ? descPix : 0;
  var base = round2(sub - desc + fr);
  var acresc = payMethod==="cartao" ? round2(base * CARD_FEE_PCT/100) : 0;
  return { kit: kr, sub: sub, fr: fr, desc: desc, base: base, pixBase: round2(sub - descPix + fr), cardBase: round2(sub + fr), acresc: acresc, total: round2(base + acresc) };
}
function setPayMethod(m){
  if(m==="pix" && !pixPermitido()){ showToast("Pix no site precisa do frete calculado pelo CEP 💕"); m = "cartao"; }
  payMethod = m;
  renderCheckoutSummary();
}
function renderCheckoutSummary(){
  var f = currentFreight; if(!f) return;
  var t = checkoutTotals();
  var el = document.getElementById("checkout-summary");
  if(el) el.innerHTML =
    cart.map(function(i){ return "<div class=\"sumrow\"><span>"+i.qty+"x "+esc(i.name)+(i.variation?(" <span class=\"muted\">("+esc(i.variation)+")</span>"):"")+"</span><span>"+brl(i.unitPrice*i.qty)+"</span></div>"; }).join("") +
    (t.kit.desconto>0 ? "<div class=\"sumrow kitrow\" style=\"margin-top:8px\"><span>"+esc(kitResumoTexto(t.kit))+"</span><span>- "+brl(t.kit.desconto)+"</span></div>" : "") +

  };

  if(!d.name){ errEl.textContent = "Informe seu nome completo."; return null; }
  if(!d.phone || d.phone.length<10){ errEl.textContent = "Informe um WhatsApp válido, com DDD."; return null; }

var ultimoPedidoPix = null;
function pagarPix(){
  if(!pixPermitido()){ setPayMethod("cartao"); return; }
  var d = lerDadosCliente(); if(!d) return;
  var errEl = document.getElementById("pix-error");
  var items = cart.map(function(it){
    var vid = it.variationId || null;
    if(!vid && it.variation){
      var prod = products.find(function(x){ return x.id===it.id; });
      var match = prod && (prod.variations||[]).find(function(v){ return ((v.size||"") + (v.color?(" / "+v.color):"")) === it.variation; });
      if(match) vid = match.id;
    }
    return { productId: it.id, variationId: vid, qty: it.qty };
  });
  var address = d.address + (d.complement ? (" - " + d.complement) : "");

    var data = res.data;

      try{ if(res.error.context && res.error.context.json){ var b = await res.error.context.json(); if(b && b.error) msg = b.error; } }catch(e){}
      errEl.textContent = msg; return;
    }
    if(!data || data.error || !data.qrCode){ errEl.textContent = (data && data.error) || "Não foi possível gerar o Pix agora."; return; }
    currentPedidoId = data.pedidoId;
    ultimoPedidoPix = { id: data.pedidoId, total: data.total, nome: d.name, entrega: currentFreight.nome, itens: cart.map(function(i){ return i.qty+"x "+i.name+(i.variation?(" ("+i.variation+")"):""); }) };
    if(data.qrCodeBase64){ document.getElementById("pix-qr-img").src = "data:image/png;base64," + data.qrCodeBase64; document.getElementById("pix-qr-wrap").style.display = ""; }

/* Pedido pelo WhatsApp/cartao: salva como "pendente_cartao" no gestao (Pedidos Online).
   O estoque so baixa quando a loja confirmar o pagamento la. Nao trava a cliente se falhar.
   (out/2026) Antes era "dispara e esquece" com keepalive logo antes de abrir o WhatsApp:
   no celular o pedido as vezes nem saia (keepalive + preflight CORS / pagina saindo).
   Agora espera a resposta (ate 6s) e devolve o id do pedido, ou null se falhar. */
function registrarPedidoPendente(d){
  try{
    var itens = cart.map(function(it){
      var vid = it.variationId || null;
      if(!vid && it.variation){
        var prod = products.find(function(x){ return x.id===it.id; });
        var match = prod && (prod.variations||[]).find(function(v){ return ((v.size||"") + (v.color?(" / "+v.color):"")) === it.variation; });
        if(match) vid = match.id;
      }
      return { productId: it.id, variationId: vid, qty: it.qty };
    });
    var semFrete = !currentFreight || currentFreight.combinarDireto || !currentFreight.servicoId;
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 6000) : null;
    return fetch(SUPABASE_URL + "/functions/v1/criar-pedido", {
      method: "POST", signal: ctrl ? ctrl.signal : undefined,
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({
        modo: "cartao_whatsapp", items: itens,
        customerName: d.name, customerPhone: d.phone,
        customerAddress: (d.address || "") + (d.complement ? (" - " + d.complement) : ""),
        cep: semFrete ? "" : (currentFreight.cep || ""),
        freightOption: { servicoId: semFrete ? null : currentFreight.servicoId },
        cupom: d.coupon || ""
      })
    }).then(function(r){ return r.json().catch(function(){ return {}; }); })
      .then(function(j){ if(timer) clearTimeout(timer); return (j && j.pedidoId) ? j.pedidoId : null; })
      .catch(function(){ if(timer) clearTimeout(timer); return null; });
  }catch(e){ return Promise.resolve(null); }
}
var enviandoPedidoWhats = false;
function finalizarPedidoWhatsapp(){
  if(enviandoPedidoWhats) return;
  var d = lerDadosCliente(); if(!d) return;

  var janela = null;

  enviandoPedidoWhats = true;

/* ================= PROMOCAO COM DATA DE INICIO E FIM (out/2026) =================
   Fonte: tabela site_promocoes (Painel do Site), lida pela vista publica site_promo_vitrine
   (so promocoes ativas que ainda nao terminaram). O PRECO de verdade continua vindo da
   catalog_products / criar-pedido, que so aplicam a promocao dentro do periodo.
   Aqui o site so: mostra a aba Promocao, o destaque na home, a contagem regressiva e o
   "Me avisa quando comecar" (e-mail, tabela promo_avisos). Quando a promocao termina,
   tudo isso some sozinho. */
var PROMOS = [];
var cardComAviso = false;
var _cdRecarregou = {};
async function carregarPromos(){
  try{
    var r = await sb.from("site_promo_vitrine").select("*");
    if(!r.error && r.data){
      PROMOS = r.data.map(function(x){
        return { id:x.id, nome:x.nome||"Promoção", tipo:x.tipo, valor:Number(x.valor)||0, product_ids:x.product_ids||[],
                 inicio: x.inicio ? Date.parse(x.inicio) : 0, fim: x.fim ? Date.parse(x.fim) : null };
      });
    }
  }catch(e){}
}
function precoCheio(p, v){
  if(v && v.price != null) return Number(v.price);
  if(p.price_max != null) return Number(p.price_max);
  return Number(p.price || 0);
}
function pctOff(de, por){ de = Number(de); por = Number(por); return (de > 0 && por < de) ? Math.round((1 - por/de)*100) : 0; }
function promoDoProduto(p){
  var ids = [p.id].concat(p._members || []);
  var agora = Date.now();
  for(var i=0;i<PROMOS.length;i++){
    var pr = PROMOS[i];
    if(pr.fim && pr.fim <= agora) continue;
    if(pr.product_ids.some(function(id){ return ids.indexOf(id) > -1; })) return pr;
  }
  return null;
}
function precoNaPromo(pr, p){
  if(pr.tipo === "pct") return Math.max(0.01, Math.round(Number(p.price||0)*(1-pr.valor/100)*100)/100);
  return pr.valor;
}
function promoEmBreve(p){ var pr = promoDoProduto(p); return !!(pr && pr.inicio > Date.now() && p.in_stock); }
function promoAtiva(p){ var pr = promoDoProduto(p); return !!(pr && pr.inicio <= Date.now()); }
function promoBadgeEmBreve(p){
  var pr = promoDoProduto(p); var off = pctOff(precoCheio(p,null), precoNaPromo(pr,p));
  return (off > 0 ? "-"+off+"% " : "") + diaCurto(pr.inicio);
}
function promoTeaserTexto(p){

var _TZ = "America/Fortaleza";
function diaSemana(ms){ try{ return new Date(ms).toLocaleDateString("pt-BR",{weekday:"long", timeZone:_TZ}).replace("-feira",""); }catch(e){ return ""; } }
function diaMes(ms){ try{ return new Date(ms).toLocaleDateString("pt-BR",{day:"2-digit", month:"2-digit", timeZone:_TZ}); }catch(e){ return ""; } }
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
/* "Sexta" se for nos proximos 6 dias, senao "30/10" */
function diaCurto(ms){ return (ms - Date.now() < 6*86400000) ? cap(diaSemana(ms)) : diaMes(ms); }
function periodoTexto(c){
  var fimReal = c.fim ? c.fim - 60000 : null;
  return cap(diaSemana(c.inicio)) + " " + diaMes(c.inicio) + (fimReal ? " a " + diaSemana(fimReal) + " " + diaMes(fimReal) : "");
}
/* Campanha em destaque: a promocao (por nome) que comeca/termina primeiro e tem peca com estoque */
function promoCampanha(){
  if(!PROMOS.length || !products.length) return null;
  var agora = Date.now(), grupos = {};
  PROMOS.forEach(function(pr){
    if(pr.fim && pr.fim <= agora) return;
    var g = grupos[pr.nome] || (grupos[pr.nome] = { nome:pr.nome, inicio:pr.inicio, fim:pr.fim, itens:[] });
    g.inicio = Math.min(g.inicio, pr.inicio);
    if(pr.fim) g.fim = g.fim ? Math.max(g.fim, pr.fim) : pr.fim;
    pr.product_ids.forEach(function(id){
      var p = products.find(function(x){ return x.id === id && x.in_stock; });
      if(p && g.itens.indexOf(p) === -1) g.itens.push(p);
    });
  });
  var lista = Object.keys(grupos).map(function(k){ return grupos[k]; }).filter(function(g){ return g.itens.length; });
  if(!lista.length) return null;
  lista.sort(function(a,b){ return (a.inicio > agora ? a.inicio : (a.fim||9e15)) - (b.inicio > agora ? b.inicio : (b.fim||9e15)); });
  var c = lista[0];
  c.fase = c.inicio > agora ? "antes" : "ativa";
  c.maxOff = 0;
  c.itens.forEach(function(p){ var pr = promoDoProduto(p); if(pr){ var o = pctOff(precoCheio(p,null), precoNaPromo(pr,p)); if(o > c.maxOff) c.maxOff = o; } });
  return c;
}

    ["dias","horas","min","seg"].map(function(u){ return "<div class=\"cd-box\"><b data-u=\""+u+"\">--</b><span>"+u+"</span></div>"; }).join("") +
  "</div>";
}
function tickCountdowns(){
  var els = document.querySelectorAll(".cd[data-alvo]");
  if(!els.length) return;
  var agora = Date.now();
  [].forEach.call(els, function(el){
    var alvo = Number(el.getAttribute("data-alvo")), d = Math.max(0, alvo - agora);
    var t = Math.floor(d/1000), v = { dias:Math.floor(t/86400), horas:Math.floor(t%86400/3600), min:Math.floor(t%3600/60), seg:t%60 };
    [].forEach.call(el.querySelectorAll("b[data-u]"), function(b){ var n = v[b.getAttribute("data-u")]; b.textContent = (n<10?"0":"")+n; });
    if(d === 0 && !_cdRecarregou[alvo]){ _cdRecarregou[alvo] = true; setTimeout(function(){ loadProducts(); }, 2500); }
  });
}

var cupomAplicado = null; // {codigo, pct}

/* Desconto do cupom na tela (o valor que vale de verdade e calculado no servidor, criar-pedido) */
var cupomAvisoSite = "";
function cupomRotulo(){ if(!cupomAplicado) return ""; return cupomAplicado.tipo==="valor" ? brl(cupomAplicado.valor) : (cupomAplicado.pct+"%"); }
function cupomDescontoSite(foraDoKit, subtotal){
  cupomAvisoSite = "";
  if(!cupomAplicado) return 0;
  var base = foraDoKit;
  if(!cupomAplicado.valeComPromo){
    var emPromo = cart.reduce(function(s2,i){ var pr = products.find(function(x){ return x.id===i.id; }); return s2 + ((pr && pr.promo_price && !pr.promo_kit) ? i.unitPrice*i.qty : 0); }, 0);
    base = round2(Math.max(0, base - emPromo));
  }
  if(cupomAplicado.minCompra>0 && subtotal < cupomAplicado.minCompra){ cupomAvisoSite = "O cupom "+cupomAplicado.codigo+" vale para compras a partir de "+brl(cupomAplicado.minCompra); return 0; }
  if(!(base>0)){ cupomAvisoSite = "O cupom "+cupomAplicado.codigo+" não vale para peças em promoção"; return 0; }
  if(cupomAplicado.tipo==="valor") return round2(Math.min(cupomAplicado.valor, base));
  return round2(base * cupomAplicado.pct/100);
}
function aplicarCupom(silencioso){
  var el = document.getElementById("pix-coupon");
  var codigo = el ? el.value.trim().toUpperCase() : "";
  if(!codigo){ cupomAplicado = null; setCupomMsg("", ""); renderCheckoutSummary(); return; }
  var tel = (document.getElementById("pix-phone").value || "").replace(/\D/g, "");
  if(tel.length < 10){ if(!silencioso) setCupomMsg("Preencha seu WhatsApp acima pra aplicar o cupom 💕", "bad"); return; }
  setCupomMsg("Conferindo cupom...", "");
  sb.functions.invoke("validar-cupom", { body: { codigo: codigo, telefone: tel } }).then(function(res){
    var d = res && res.data;
    if(d && d.valid){
      cupomAplicado = { codigo: codigo, pct: Number(d.descontoPct) || 0, tipo: d.tipo || "pct", valor: Number(d.valor) || Number(d.descontoPct) || 0, minCompra: Number(d.minCompra) || 0, valeComPromo: d.valeComPromocao !== false };
      setCupomMsg("Cupom aplicado! " + cupomRotulo() + " de desconto nas peças no pagamento via Pix 💕" + (cupomAplicado.minCompra>0 ? " (compras a partir de " + brl(cupomAplicado.minCompra) + ")" : "") + (!cupomAplicado.valeComPromo ? " Não vale para peças em promoção." : "") + (cartKit().desconto>0 ? " O cupom não vale para as peças da promoção Leve 2 (não é cumulativo)." : ""), "ok");
    } else {
      cupomAplicado = null;
      setCupomMsg((d && d.message) || "Não foi possível validar o cupom agora.", "bad");
    }
    renderCheckoutSummary();
  }).catch(function(){ setCupomMsg("Não foi possível validar o cupom agora.", "bad"); });
}

function _uidCurto(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function _getId(storage, key){
  try{ var v = storage.getItem(key); if(!v){ v = _uidCurto(); storage.setItem(key, v); } return v; }catch(e){ return null; }
}
function origemVisita(){
  try{
    var params = new URLSearchParams(window.location.search);
    var utm = (params.get("utm_source") || "").toLowerCase();
    if(params.get("fbclid") || utm.indexOf("ig")===0 || utm.indexOf("insta")>-1) return "instagram";
    if(utm.indexOf("face")>-1 || utm==="fb") return "facebook";
    if(utm.indexOf("whats")>-1 || utm==="wa") return "whatsapp";
    if(params.get("gclid") || utm.indexOf("google")>-1) return "google";
    if(utm) return utm.slice(0,40);
    var ref = (document.referrer || "").toLowerCase();
    if(!ref) return "direto";
    if(ref.indexOf(location.hostname)>-1) return "interno";
    if(ref.indexOf("instagram")>-1) return "instagram";
    if(ref.indexOf("facebook")>-1 || ref.indexOf("fb.")>-1) return "facebook";
    if(ref.indexOf("whatsapp")>-1 || ref.indexOf("wa.me")>-1) return "whatsapp";
    if(ref.indexOf("google")>-1) return "google";
    if(ref.indexOf("tiktok")>-1) return "tiktok";
    return "outro";
  }catch(e){ return "direto"; }
}

    if(!_origemSessao){ _origemSessao = origemVisita(); try{ sessionStorage.setItem("korpa_origem", _origemSessao); }catch(e){} }
  }
  var prodId = null, prodName = null;

  }
  var ref = "";
  try{ ref = document.referrer ? new URL(document.referrer).hostname : ""; }catch(e){}
  sb.from("site_visitas").insert({

      "<div class=\"lp-body\" id=\"lp-form\">" +
        "<div class=\"field\"><label>Seu nome</label><input id=\"lp-nome\" type=\"text\" autocomplete=\"name\" placeholder=\"Como podemos te chamar?\"></div>" +
        "<div class=\"field\"><label>WhatsApp (com DDD)</label><input id=\"lp-whats\" type=\"tel\" inputmode=\"numeric\" autocomplete=\"tel\" placeholder=\"85999999999\" maxlength=\"15\" onkeydown=\"if(event.key==='Enter')enviarLead()\"></div>" +
        "<button class=\"btn block\" id=\"lp-btn\" onclick=\"enviarLead()\">Quero meu cupom</button>" +
        "<div class=\"lp-err\" id=\"lp-err\"></div>" +
        "<div class=\"lp-fine\">"+esc(popupTxt("aviso","Cupom de uso único por WhatsApp, válido no pagamento via Pix aqui no site. Não é cumulativo com promoções. A gente só usa seu contato pra te mandar novidades da KORPA."))+"</div>" +
      "</div>" +
      "<div class=\"lp-body\" id=\"lp-done\" style=\"display:none\">" +
        "<p style=\"text-align:center;margin:0 0 4px\" id=\"lp-ola\"></p>" +
        "<div class=\"lp-code\"><b>"+LEAD_CUPOM+"</b><button onclick=\"copiarCupomLead()\" id=\"lp-copy\">Copiar</button></div>" +
        "<button class=\"btn block\" onclick=\"fecharPopupLead()\">Ir às compras</button>" +
        "<div class=\"lp-fine\">O cupom já vai aparecer preenchido quando você finalizar a compra 💕</div>" +
      "</div>" +
    "</div>");
}
function abrirPopupLead(forcar){
  if(leadCadastrado()) return;
  if(popupDesligado()) return;
  if(!forcar && leadFechadoNestaVisita()) return;
  var pm = document.getElementById("pix-modal");
  if(pm && pm.classList.contains("open")) return; // nao atrapalha quem ja esta finalizando
  montarPopupLead();
  esconderBotaoLead();
  document.getElementById("lead-ov").classList.add("show");
  document.getElementById("lead-pop").classList.add("show");
}
function fecharPopupLead(){
  var o = document.getElementById("lead-ov"), p = document.getElementById("lead-pop");
  if(o) o.classList.remove("show"); if(p) p.classList.remove("show");
  if(!leadCadastrado()){ try{ sessionStorage.setItem("korpa_lead_fechado", "1"); }catch(e){} mostrarBotaoLead(); }
}
function enviarLead(){
  var nome = (document.getElementById("lp-nome").value || "").trim();
  var tel = (document.getElementById("lp-whats").value || "").replace(/\D/g, "");
  if(tel.length === 13 && tel.indexOf("55")===0) tel = tel.slice(2);
  var err = document.getElementById("lp-err");
  err.textContent = "";
  if(!nome){ err.textContent = "Informe seu nome."; return; }
  if(tel.length < 10 || tel.length > 11 || /^(\d)\1+$/.test(tel.slice(2))){ err.textContent = "Informe um WhatsApp válido, com DDD."; return; }
  var btn = document.getElementById("lp-btn"); btn.disabled = true; btn.textContent = "Gerando seu cupom...";
  var mostrar = function(){
    try{
      var saved = JSON.parse(localStorage.getItem("korpa_cliente")||"{}");
      if(!saved["pix-name"]) saved["pix-name"] = nome;
      if(!saved["pix-phone"]) saved["pix-phone"] = tel;
      localStorage.setItem("korpa_cliente", JSON.stringify(saved));
      localStorage.setItem("korpa_cupom_popup", LEAD_CUPOM);
      localStorage.setItem("korpa_lead_ok", "1");
    }catch(e){}
    esconderBotaoLead();
    sincronizarCarrinho("popup", true);
    document.getElementById("lp-ola").textContent = "Prontinho, " + nome.split(" ")[0] + "! Seu cupom é:";
    document.getElementById("lp-form").style.display = "none";
    document.getElementById("lp-done").style.display = "";
  };
  sb.from("cupom_leads").insert({ nome: nome.slice(0,120), whatsapp: tel, cupom: LEAD_CUPOM, pagina: (window.location.hash||"#home").slice(0,200) })
    .then(function(){ mostrar(); }, function(){ mostrar(); });
}
function copiarCupomLead(){
  var b = document.getElementById("lp-copy");
  try{ navigator.clipboard.writeText(LEAD_CUPOM).then(function(){ b.textContent = "Copiado!"; }); }catch(e){ b.textContent = "Copiado!"; }
}
(function iniciarPopupLead(){
  if(leadCadastrado()) return;
  if(leadFechadoNestaVisita()){ setTimeout(mostrarBotaoLead, 1500); return; }
  _leadTimer = setTimeout(abrirPopupLead, LEAD_DELAY_MS);
  // no computador: tambem abre quando o mouse sai pela parte de cima (vai fechar a aba)
  document.addEventListener("mouseout", function(e){
    if(!e.relatedTarget && e.clientY <= 0 && !leadJaVisto() && (Date.now() - _leadInicio) > 4000){ clearTimeout(_leadTimer); abrirPopupLead(); }
  });
})();
</script>
</body>
</html>
